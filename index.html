<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AI Video Studio</title>
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --panel-2: #172135;
    --border: #233049;
    --text: #e8eef8;
    --muted: #8b9bb5;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --green: #22c55e;
    --blue: #3b82f6;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  html, body {
    height: 100%; width: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .app-shell {
    display: flex; flex-direction: column; height: 100dvh; width: 100%;
    padding: 6px; gap: 6px;
  }

  /* Top Bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 10px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; letter-spacing: 0.2px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .top-actions { display: flex; gap: 5px; align-items: center; }
  .btn-chip {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: 0.15s;
  }
  .btn-chip:active { transform: scale(0.96); }
  .btn-chip.active { border-color: var(--accent); background: var(--accent-soft); color: #fff; }
  .btn-chip.locked { border-color: var(--green); color: var(--green); }
  .btn-chip.danger { border-color: rgba(239,68,68,0.45); color: #fca5a5; }
  .btn-chip.recover { border-color: var(--green); background: rgba(34,197,94,0.14); color: #bbf7d0; font-weight: 600; }

  /* 6-Box Clean Workspace (Tools Hidden by Default -> Bigger Workflow) */
  .workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .upper-row { flex: 1.28; min-height: 0; display: grid; grid-template-columns: 1.65fr 1fr; gap: 6px; }
  .lower-row { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.65fr; gap: 6px; transition: 0.2s; }
  .lower-row.tools-open { grid-template-columns: 0.95fr 1.2fr 0.62fr; }

  /* Box Card */
  .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; flex-direction: column;
    min-height: 0; min-width: 0; overflow: hidden; position: relative;
  }
  .box-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.018); flex-shrink: 0;
  }
  .box-title {
    font-size: 10.5px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }

  /* 4-Color Live LED Dots */
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #3f4f6b;
    display: inline-block; flex-shrink: 0; transition: 0.2s;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.blue { background: var(--blue); box-shadow: 0 0 9px var(--accent); animation: ledPulse 0.8s infinite; }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 7px var(--yellow); animation: ledPulse 1.2s infinite; }
  .dot.red { background: var(--red); box-shadow: 0 0 7px var(--red); animation: ledPulse 1.1s infinite; }
  .dot-btn { cursor: pointer; padding: 2px; border-radius: 50%; display: inline-flex; align-items: center; }
  @keyframes ledPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.86); }
  }

  /* Capability Badges + Active Blue Blinking Animation */
  .cap-row { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
  .cap-badge {
    font-size: 8.5px; font-weight: 700; padding: 1px 4px; border-radius: 4px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    color: var(--muted); letter-spacing: 0.2px; transition: 0.2s;
  }
  .cap-badge.ready { color: #cbd5e1; border-color: rgba(34,197,94,0.35); }
  .cap-badge.working {
    background: rgba(59,130,246,0.28); border-color: var(--accent);
    color: #e0f2fe; box-shadow: 0 0 8px rgba(56,189,248,0.65);
    animation: ledPulse 0.8s infinite;
  }
  .tier-tag {
    font-size: 8.5px; font-weight: 700; padding: 1px 4px; border-radius: 4px;
    background: rgba(56,189,248,0.12); color: var(--accent); border: 1px solid rgba(56,189,248,0.3);
  }
  .tier-tag.max { background: rgba(168,85,247,0.18); color: #d8b4fe; border-color: rgba(168,85,247,0.4); }
  .tier-tag.high { background: rgba(56,189,248,0.16); color: #7dd3fc; border-color: rgba(56,189,248,0.38); }
  .tier-tag.med { background: rgba(34,197,94,0.14); color: #86efac; border-color: rgba(34,197,94,0.35); }

  .icon-btn {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 6px;
  }
  .icon-btn:active { background: var(--panel-2); color: var(--text); }
  .icon-btn.glow { color: var(--accent); animation: ledPulse 1s infinite; }

  /* Box 1: Director AI Chat */
  .chat-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
  }
  .msg {
    max-width: 93%; padding: 8px 10px; border-radius: 10px;
    line-height: 1.45; word-wrap: break-word; font-size: 12.5px; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 3px; }
  .msg.ai { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.sys {
    align-self: center; background: rgba(56,189,248,0.08);
    border: 1px dashed rgba(56,189,248,0.32); color: #bae6fd;
    font-size: 11px; padding: 5px 9px; text-align: center;
  }
  .msg-tools { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .mini-act {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .mini-act.primary { background: var(--accent); color: #06101c; border-color: var(--accent); font-weight: 600; }
  .mini-act.speaking { background: var(--red); border-color: var(--red); color: #fff; }

  /* Dynamic Choice-Filling Checklist Card inside Chat */
  .choice-card {
    margin-top: 7px; padding: 8px; border-radius: 8px;
    background: rgba(10,14,23,0.72); border: 1px solid rgba(56,189,248,0.32);
    display: flex; flex-direction: column; gap: 6px;
  }
  .choice-group-title { font-size: 10px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.3px; }
  .choice-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .choice-chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; padding: 4px 7px; font-size: 10.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: 0.15s;
  }
  .choice-chip.checked {
    background: rgba(34,197,94,0.16); border-color: var(--green); color: #dcfce7; font-weight: 600;
  }

  /* Draft Edit Bar before Sending */
  .draft-bar {
    display: none; align-items: center; justify-content: space-between; gap: 6px;
    padding: 4px 8px; background: rgba(56,189,248,0.1); border-top: 1px solid var(--border);
    font-size: 10.5px; color: #bae6fd; flex-shrink: 0;
  }
  .draft-bar.show { display: flex; }

  .chat-input-wrap {
    display: flex; gap: 5px; padding: 6px; border-top: 1px solid var(--border);
    background: var(--panel); align-items: center; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12.5px; outline: none; min-width: 0;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent); color: #06101c; border: none; border-radius: 8px;
    padding: 7px 10px; font-weight: 700; font-size: 11.5px; cursor: pointer;
  }

  /* 4 Category Columns + Per-Key LED Matrix under Chat */
  .cat-matrix {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 4px 6px 6px; border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.22); flex-shrink: 0;
  }
  .cat-col {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; min-width: 0;
  }
  .cat-col.has-alert { border-color: var(--yellow); background: rgba(245,158,11,0.12); }
  .cat-top {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    font-size: 9.5px; font-weight: 600; color: var(--text);
  }
  .cat-leds { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: wrap; min-height: 9px; }
  .badge-num {
    background: var(--yellow); color: #0b0f17; font-weight: 700; font-size: 8.5px;
    padding: 0 3px; border-radius: 6px;
  }

  /* Right Upper: Box 2 (Output) + Box 3 (Vault) */
  .right-upper { display: flex; flex-direction: column; gap: 6px; min-height: 0; min-width: 0; }
  .box-output { flex: 1.28; }
  .box-vault { flex: 0.82; }
  .output-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 5px; justify-content: center; align-items: center;
  }
  .output-body.has-content { justify-content: flex-start; align-items: stretch; }
  .output-empty { color: var(--muted); font-size: 10.5px; text-align: center; opacity: 0.78; }
  .output-img { width: 100%; max-height: 102px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; background: #000; }
  .output-text-snippet { font-size: 10.5px; color: #cbd5e1; line-height: 1.35; max-height: 62px; overflow: hidden; }
  .output-pulse { width: 100%; height: 3px; background: var(--panel-2); overflow: hidden; display: none; }
  .output-pulse.active { display: block; }
  .output-pulse::after { content: ""; display: block; width: 45%; height: 100%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .output-foot {
    display: flex; gap: 4px; padding: 4px 6px; border-top: 1px solid var(--border);
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }

  /* Vault */
  .vault-body { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
  .vault-item {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 6px; font-size: 10px; cursor: pointer;
  }
  .vault-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* Box 4: API Keys with Per-Key Dots + Capability Badges */
  .api-list { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 5px; }
  .api-row {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 5px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .api-row-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; gap: 4px; }
  .dots-wrap { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
  .api-row-sub { font-size: 9.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Box 5: Live Workflow + Bottom Blinking Notification Bar */
  .wf-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 5px; scroll-behavior: smooth;
  }
  .wf-item {
    background: var(--panel-2); border-left: 2px solid var(--accent);
    border-radius: 6px; padding: 5px 7px; font-size: 11px; line-height: 1.35;
  }
  .wf-item.ok { border-left-color: var(--green); }
  .wf-item.work { border-left-color: var(--blue); }
  .wf-item.warn { border-left-color: var(--yellow); }
  .wf-item.err { border-left-color: var(--red); }
  .wf-meta { font-size: 9.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }

  .notif-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.02); font-size: 10.5px; color: var(--muted);
    cursor: pointer; flex-shrink: 0;
  }
  .notif-bar.has-notif {
    background: rgba(245,158,11,0.15); color: #fde68a; border-top-color: var(--yellow);
  }
  .notif-pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .notif-bar.has-notif .notif-pill { animation: ledPulse 1.1s infinite; }

  /* Box 6: Collapsible Tools */
  .box-tools { display: none; }
  .lower-row.tools-open .box-tools { display: flex; }
  .toolbox-body {
    flex: 1; min-height: 0; padding: 6px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-align: center;
  }
  .toolbox-slot {
    width: 100%; border: 1px dashed var(--border); border-radius: 9px;
    padding: 10px 4px; color: var(--muted); font-size: 10.5px;
  }
  .toolbox-slot.active { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: #e0f2fe; }

  /* Compact Floating Popover */
  .popover-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 14px;
  }
  .popover-backdrop.open { display: flex; }
  .popover-card {
    width: 100%; max-width: 360px; max-height: 84dvh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.65);
  }
  .popover-card.wide { max-width: 470px; }
  .pop-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 13px;
  }
  .field-label { font-size: 11px; color: var(--muted); margin: 7px 0 3px; display: block; }
  .field-input, .field-select, .field-textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12px; outline: none;
  }
  .field-textarea { min-height: 75px; resize: vertical; }
  .row-gap { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .key-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px; margin-bottom: 8px;
  }
  .mini-chat-box {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    display: flex; gap: 5px;
  }
  audio { width: 100%; height: 30px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span> AI Video Studio</div>
    <div class="top-actions">
      <button class="btn-chip" id="btnLock" onclick="openLockPopover()">Lock</button>
      <button class="btn-chip" id="btnSave" onclick="saveCurrentProject()">Save</button>
      <button class="btn-chip" id="btnFiles" onclick="openFilesPopover()">Files</button>
      <button class="btn-chip" id="btnStop" onclick="cancelActiveJob()">Stop</button>
    </div>
  </header>

  <!-- 6-Box Clean Workspace -->
  <main class="workspace">

    <!-- Upper Row: Box 1 (Chat) + Box 2 (Output) & Box 3 (Vault) -->
    <section class="upper-row">

      <!-- Box 1: Director AI Chat -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot" id="directorDot"></span> Director AI</div>
          <div>
            <button class="icon-btn" onclick="openChatFull()" title="Expand">⤢</button>
            <button class="icon-btn" onclick="clearChat()" title="Clear">🗑</button>
          </div>
        </div>
        <div class="chat-feed" id="chatFeed"></div>

        <!-- Draft Edit / Cancel Bar before Sending -->
        <div class="draft-bar" id="draftBar">
          <span>Edit or send</span>
          <div style="display:flex;gap:4px;">
            <button class="mini-act" onclick="focusChatInput()">Edit</button>
            <button class="mini-act" onclick="clearDraft()">Cancel</button>
          </div>
        </div>

        <div class="chat-input-wrap">
          <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice">🎤</button>
          <input class="chat-input" id="chatInput" placeholder="কথা বলো, লিংক দাও বা ভিডিও বানাতে বলো..." oninput="onDraftInput()" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat();}" />
          <button class="send-btn" onclick="sendChat()">Send</button>
        </div>

        <!-- 4 Categories + Per-Key LED Matrix -->
        <div class="cat-matrix">
          <div class="cat-col" id="col-image" onclick="openAgentAlertPopover('image')">
            <div class="cat-top">Image <span class="badge-num" id="anum-image" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-image"></div>
          </div>
          <div class="cat-col" id="col-video" onclick="openAgentAlertPopover('video')">
            <div class="cat-top">Video <span class="badge-num" id="anum-video" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-video"></div>
          </div>
          <div class="cat-col" id="col-audio" onclick="openAgentAlertPopover('audio')">
            <div class="cat-top">Audio <span class="badge-num" id="anum-audio" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-audio"></div>
          </div>
          <div class="cat-col" id="col-editing" onclick="openAgentAlertPopover('editing')">
            <div class="cat-top">Edit <span class="badge-num" id="anum-editing" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-editing"></div>
          </div>
        </div>
      </div>

      <!-- Right Upper Stack: Box 2 (Output) + Box 3 (Vault) -->
      <div class="right-upper">
        <div class="box box-output">
          <div class="box-head">
            <div class="box-title"><span class="dot" id="outDot"></span> Output</div>
            <div style="display:flex;align-items:center;gap:2px;">
              <button class="btn-chip" id="ratioBtn" style="padding:2px 5px;font-size:9.5px;" onclick="toggleRatio()">16:9</button>
              <button class="btn-chip" id="ccBtn" style="padding:2px 5px;font-size:9.5px;" onclick="toggleCC()">CC</button>
              <button class="icon-btn" onclick="openOutputPopover()" title="Full">⤢</button>
            </div>
          </div>
          <div class="output-pulse" id="outPulse"></div>
          <div class="output-body" id="outBody">
            <div class="output-empty">স্যাম্পল বা ফাইনাল আউটপুট এখানে দেখাবে</div>
          </div>
          <div class="output-foot">
            <span id="outTag" style="font-size:9.5px;color:var(--muted);">Standby</span>
            <div style="display:flex;gap:4px;">
              <button class="btn-chip" id="swapBtn" style="padding:2px 6px;font-size:10px;display:none;" onclick="swapWithVault()">Swap</button>
              <button class="btn-chip active" style="padding:2px 7px;font-size:10px;" onclick="exportMP4Video()">MP4</button>
            </div>
          </div>
        </div>

        <div class="box box-vault">
          <div class="box-head">
            <div class="box-title">Vault (<span id="vaultCount">0</span>)</div>
            <div>
              <button class="icon-btn" id="undoVaultBtn" style="display:none;" onclick="undoVaultDelete()" title="Undo">↩</button>
              <button class="icon-btn" onclick="openVaultPopover()" title="Open">⤢</button>
            </div>
          </div>
          <div class="vault-body" id="vaultBody">
            <div class="output-empty">বাড়তি ফাইল এখানে জমবে</div>
          </div>
        </div>
      </div>

    </section>

    <!-- Lower Row: Box 4 (API) + Box 5 (Big Workflow) + Collapsible Box 6 (Tools) -->
    <section class="lower-row" id="lowerRow">

      <!-- Box 4: API Keys -->
      <div class="box">
        <div class="box-head">
          <div class="box-title">API Keys</div>
          <button class="icon-btn" onclick="openApiPopover('director')" title="Settings">⚙</button>
        </div>
        <div class="api-list" id="apiList"></div>
      </div>

      <!-- Box 5: Live Workflow + Bottom Blinking Notification Bar -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot" id="wfDot"></span> Workflow <span id="coworkBadge" style="font-size:9px;color:var(--accent);margin-left:3px;">Solo</span></div>
          <div style="display:flex;align-items:center;gap:2px;">
            <button class="icon-btn" onclick="clearWorkflow()" title="Clear">🗑</button>
            <button class="icon-btn" id="toolsToggleBtn" onclick="toggleToolsDrawer()" title="Tools">◀</button>
          </div>
        </div>
        <div class="wf-feed" id="wfFeed"></div>
        <div class="notif-bar" id="notifBar" onclick="openNotifPopover()">
          <span class="notif-pill" id="notifText">🔔 0</span>
          <span style="font-size:10px;">Tap / Recover</span>
        </div>
      </div>

      <!-- Box 6: Collapsible Tools -->
      <div class="box box-tools">
        <div class="box-head">
          <div class="box-title">Tools</div>
          <button class="icon-btn" onclick="toggleToolsDrawer()" title="Hide">▶</button>
        </div>
        <div class="toolbox-body" onclick="openToolboxPopover()">
          <div class="toolbox-slot" id="toolboxSlot">
            <div id="toolboxIcon" style="font-size:16px;margin-bottom:3px;">+</div>
            <div id="toolboxText">Standby</div>
          </div>
        </div>
      </div>

    </section>

  </main>
</div>

<!-- Compact Floating Popover -->
<div class="popover-backdrop" id="popBackdrop" onclick="if(event.target===this)closePopover()">
  <div class="popover-card" id="popCard">
    <div class="pop-head">
      <span id="popTitle">Panel</span>
      <button class="icon-btn" onclick="closePopover()">✕</button>
    </div>
    <div id="popContent"></div>
  </div>
</div>
<script>
const STORAGE_KEY = 'ai_video_studio_v13_state';
const AGENT_META = [
  { id: 'director', name: 'Director', cap: 'TXT' },
  { id: 'image', name: 'Image', cap: 'IMG' },
  { id: 'video', name: 'Video', cap: 'VID' },
  { id: 'audio', name: 'Audio', cap: 'AUD' },
  { id: 'editing', name: 'Edit', cap: 'EDT' }
];

function makeSlot() {
  return {
    key: '', provider: 'openrouter', model: '', models: [], customUrl: '',
    status: 'idle', error: '', tier: 'Medium', caps: [], activeCaps: [],
    triedModels: [], note: '', usage: 0
  };
}

let state = {
  agents: {
    director: { slots: [makeSlot()] },
    image: { slots: [makeSlot()] },
    video: { slots: [makeSlot()] },
    audio: { slots: [makeSlot()] },
    editing: { slots: [makeSlot()] }
  },
  chat: [],
  workflow: [],
  notifs: [],
  agentAlerts: { image: [], video: [], audio: [], editing: [] },
  output: null,
  vault: [],
  deletedVault: [],
  savedProjects: [],
  characterLock: '',
  cowork: false,
  ratio: '16:9',
  cc: true,
  toolsOpen: false,
  activeJobId: null,
  isBusy: false,
  pendingChoice: null
};

let speakingMsgId = null;
let recognition = null;
let isListening = false;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') state = Object.assign(state, parsed);
    }
  } catch (e) {}
  if (!state.agents || typeof state.agents !== 'object') state.agents = {};
  if (!Array.isArray(state.chat)) state.chat = [];
  if (!Array.isArray(state.workflow)) state.workflow = [];
  if (!Array.isArray(state.notifs)) state.notifs = [];
  if (!Array.isArray(state.vault)) state.vault = [];
  if (!Array.isArray(state.deletedVault)) state.deletedVault = [];
  if (!Array.isArray(state.savedProjects)) state.savedProjects = [];
  state.agentAlerts = Object.assign({ image: [], video: [], audio: [], editing: [] }, state.agentAlerts || {});
  AGENT_META.forEach(a => {
    const slots = state.agents[a.id]?.slots;
    if (!Array.isArray(slots) || !slots.length) {
      state.agents[a.id] = { slots: [makeSlot()] };
    } else {
      state.agents[a.id].slots = slots.map(s => {
        const clean = Object.assign(makeSlot(), s || {});
        if (!Array.isArray(clean.models)) clean.models = [];
        if (!Array.isArray(clean.caps)) clean.caps = [];
        if (!Array.isArray(clean.activeCaps)) clean.activeCaps = [];
        if (!Array.isArray(clean.triedModels)) clean.triedModels = [];
        if (clean.status === 'working') clean.status = clean.key ? 'ready' : 'idle';
        clean.activeCaps = [];
        return clean;
      });
    }
  });
  state.isBusy = false;
  state.activeJobId = null;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

function nowTime() {
  return new Date().toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
}

function inferTierAndCaps(provider, model, agentId) {
  const m = (model || '').toLowerCase();
  const p = (provider || '').toLowerCase();
  let tier = 'Medium';
  if (/pro|opus|sonnet|gpt-4o|o1|o3|r1|kling-2|gen-4|veo|sora|flux-pro|eleven_multilingual_v2|4k/.test(m)) tier = 'Max';
  else if (/flash|70b|turbo|kling|runway|minimax|flux|recraft|eleven|gemini-2/.test(m)) tier = 'High';

  const caps = new Set();
  if (agentId === 'director') caps.add('TXT');
  if (agentId === 'image') caps.add('IMG');
  if (agentId === 'video') caps.add('VID');
  if (agentId === 'audio') caps.add('AUD');
  if (agentId === 'editing') caps.add('EDT');

  if (p === 'google' || /gemini/.test(m)) { caps.add('TXT'); caps.add('IMG'); caps.add('VID'); caps.add('AUD'); caps.add('EDT'); }
  else if (p === 'openrouter' || p === 'openai') { caps.add('TXT'); caps.add('EDT'); if (/gpt-4o|vision|image|flux|omni/.test(m)) caps.add('IMG'); }
  else if (p === 'elevenlabs' || /eleven/.test(m)) { caps.add('AUD'); }
  else if (p === 'fal' || p === 'replicate' || /kling|runway|veo|hailuo/.test(m)) { caps.add('VID'); caps.add('IMG'); }
  else if (p === 'groq' || p === 'deepseek' || p === 'mistral') { caps.add('TXT'); caps.add('EDT'); }

  return { tier, caps: Array.from(caps) };
}

function getActiveSlot(agentId) {
  const slots = (state.agents[agentId] && state.agents[agentId].slots) || [];
  return slots.find(s => s.key && s.status !== 'error') || slots.find(s => s.key) || null;
}

function buildBackendConfig(agentId) {
  const slots = (state.agents[agentId] && state.agents[agentId].slots) || [];
  const valid = slots.filter(s => s.key && s.key.trim());
  if (!valid.length) return null;
  const primary = valid.find(s => s.status !== 'error') || valid[0];
  const ordered = [primary, ...valid.filter(s => s !== primary)];
  const keys = ordered.map((s, i) => ({
    idx: i + 1,
    provider: s.provider || 'openrouter',
    model: s.model || '',
    customUrl: s.customUrl || '',
    apiKey: s.key.trim()
  }));
  return {
    provider: primary.provider || 'openrouter',
    apiKey: primary.key.trim(),
    model: primary.model || '',
    customUrl: primary.customUrl || '',
    key1: keys[0]?.apiKey || '',
    key2: keys[1]?.apiKey || '',
    key3: keys[2]?.apiKey || '',
    keys
  };
}
  
function getTeamSummary() {
  const lines = [];
  let advancedCount = 0;
  AGENT_META.forEach(a => {
    const s = getActiveSlot(a.id);
    if (!s) {
      lines.push(`${a.name}: যুক্ত নেই`);
    } else {
      if (s.tier === 'Max' || s.tier === 'High' || s.provider === 'elevenlabs') advancedCount++;
      lines.push(`${a.name}: চালু (${s.provider}/${s.model || 'auto'}, Power:${s.tier}, Caps:${(s.caps||[]).join(',')})`);
    }
  });
  return { text: lines.join('\n'), advancedCount };
}

function addWorkflow(title, text, type = 'info') {
  state.workflow.push({ id: Date.now() + Math.random(), title, text, type, time: nowTime() });
  if (state.workflow.length > 50) state.workflow.shift();
  renderWorkflow();
  saveState();
}

function addNotif(agentId, msg, recoverable = true) {
  state.notifs.unshift({ id: Date.now() + Math.random(), agentId, msg, recoverable, time: nowTime(), resolved: false });
  if (state.notifs.length > 30) state.notifs.pop();
  if (state.agentAlerts[agentId]) {
    state.agentAlerts[agentId].unshift({ msg, time: nowTime() });
    if (state.agentAlerts[agentId].length > 10) state.agentAlerts[agentId].pop();
  }
  renderNotifs();
  renderCatMatrix();
  saveState();
}

function setAgentWorking(agentId, working, activeCapList = []) {
  const slots = state.agents[agentId]?.slots || [];
  const active = getActiveSlot(agentId);
  slots.forEach(s => {
    if (!s.key) return;
    if (working && s === active && s.status !== 'error') {
      s.status = 'working';
      s.activeCaps = activeCapList.length ? activeCapList : (s.caps || []);
    } else if (!working && s.status === 'working') {
      s.status = 'ready';
      s.activeCaps = [];
    }
  });
  renderApiList();
  renderCatMatrix();
  updateTopDots();
}

function updateTopDots() {
  const dSlot = getActiveSlot('director');
  const dDot = document.getElementById('directorDot');
  dDot.className = 'dot ' + (!dSlot ? '' : dSlot.status === 'working' ? 'blue' : dSlot.status === 'error' ? 'red' : 'green');
  const wfDot = document.getElementById('wfDot');
  wfDot.className = 'dot ' + (state.isBusy ? 'blue' : 'green');
  const outDot = document.getElementById('outDot');
  outDot.className = 'dot ' + (state.isBusy ? 'blue' : state.output ? 'green' : '');
  document.getElementById('outPulse').className = 'output-pulse' + (state.isBusy ? ' active' : '');
  document.getElementById('coworkBadge').textContent = state.cowork ? 'Co-Work' : 'Solo';
  document.getElementById('btnLock').className = 'btn-chip' + (state.characterLock ? ' locked' : '');
  document.getElementById('ratioBtn').textContent = state.ratio;
  document.getElementById('ccBtn').className = 'btn-chip' + (state.cc ? ' active' : '');
}

function renderApiList() {
  const el = document.getElementById('apiList');
  el.innerHTML = AGENT_META.map(a => {
    const slots = state.agents[a.id].slots;
    const active = getActiveSlot(a.id);
    const dotsHtml = slots.map((s, idx) => {
      const cls = !s.key ? '' : s.status === 'working' ? 'blue' : s.status === 'error' ? 'red' : s.status === 'warn' ? 'yellow' : 'green';
      return `<span class="dot-btn" onclick="event.stopPropagation();onDotClick('${a.id}',${idx})"><span class="dot ${cls}"></span></span>`;
    }).join('');
    const tierCls = active ? (active.tier === 'Max' ? 'max' : active.tier === 'High' ? 'high' : 'med') : '';
    const tierHtml = active ? `<span class="tier-tag ${tierCls}">${active.tier}</span>` : '';
    const capsHtml = active && active.caps.length ? `<div class="cap-row">${active.caps.map(c => {
      const isWork = active.status === 'working' && (active.activeCaps || []).includes(c);
      return `<span class="cap-badge ${isWork ? 'working' : 'ready'}">${c}</span>`;
    }).join('')}</div>` : '';
    const sub = active ? `${active.provider} · ${active.model || 'auto'}` : 'Key বসানো নেই';
    return `<div class="api-row" onclick="openApiPopover('${a.id}')">
      <div class="api-row-top">
        <span>${a.name} ${tierHtml}</span>
        <span class="dots-wrap">${dotsHtml}</span>
      </div>
      ${capsHtml}
      <div class="api-row-sub">${esc(sub)}</div>
    </div>`;
  }).join('');
}

function renderCatMatrix() {
  const cats = [
    { id: 'image', cap: 'IMG' },
    { id: 'video', cap: 'VID' },
    { id: 'audio', cap: 'AUD' },
    { id: 'editing', cap: 'EDT' }
  ];
  cats.forEach(c => {
    const ledsEl = document.getElementById('leds-' + c.id);
    const colEl = document.getElementById('col-' + c.id);
    const numEl = document.getElementById('anum-' + c.id);
    const alerts = state.agentAlerts[c.id] || [];
    colEl.className = 'cat-col' + (alerts.length ? ' has-alert' : '');
    numEl.style.display = alerts.length ? 'inline' : 'none';
    numEl.textContent = alerts.length;

    const dots = [];
    AGENT_META.forEach(a => {
      state.agents[a.id].slots.forEach(s => {
        if (!s.key) return;
        if (a.id === c.id || (s.caps || []).includes(c.cap)) {
          const isWork = s.status === 'working' && ((s.activeCaps || []).includes(c.cap) || a.id === c.id);
          const cls = isWork ? 'blue' : s.status === 'error' ? 'red' : s.status === 'warn' ? 'yellow' : 'green';
          dots.push(`<span class="dot ${cls}" title="${a.name} (${s.model || s.provider})"></span>`);
        }
      });
    });
    ledsEl.innerHTML = dots.length ? dots.join('') : '<span class="dot"></span>';
  });
}

function renderWorkflow() {
  const el = document.getElementById('wfFeed');
  if (!state.workflow.length) {
    el.innerHTML = '<div class="output-empty" style="margin-top:20px;">টিমের লাইভ কাজের ধাপ ও কথোপকথন এখানে দেখাবে</div>';
    return;
  }
  el.innerHTML = state.workflow.map(w => `
    <div class="wf-item ${w.type}">
      <div class="wf-meta"><b>${esc(w.title)}</b><span>${w.time}</span></div>
      <div>${esc(w.text)}</div>
    </div>`).join('');
  el.scrollTop = el.scrollHeight;
}

function renderNotifs() {
  const active = state.notifs.filter(n => !n.resolved);
  const bar = document.getElementById('notifBar');
  bar.className = 'notif-bar' + (active.length ? ' has-notif' : '');
  document.getElementById('notifText').textContent = `🔔 ${active.length}`;
}

function renderOutput() {
  const body = document.getElementById('outBody');
  const tag = document.getElementById('outTag');
  const swapBtn = document.getElementById('swapBtn');
  swapBtn.style.display = (state.output && state.vault.length) ? 'inline-flex' : 'none';
  if (!state.output) {
    body.className = 'output-body';
    body.innerHTML = '<div class="output-empty">স্যাম্পল বা ফাইনাল আউটপুট এখানে দেখাবে</div>';
    tag.textContent = 'Standby';
    return;
  }
  body.className = 'output-body has-content';
  tag.textContent = `${state.output.stage || 'Sample'} · ${state.ratio}`;
  let html = '';
  if (state.output.videoUrl) {
    html += `<video class="output-img" controls playsinline src="${esc(state.output.videoUrl)}"></video>`;
  } else if (state.output.imgUrl) {
    html += `<img class="output-img" src="${esc(state.output.imgUrl)}" onclick="openOutputPopover()" />`;
  }
  if (state.output.audioUrl) {
    html += `<audio controls src="${esc(state.output.audioUrl)}"></audio>`;
  }
  html += `<div class="output-text-snippet">${esc(state.output.title || 'Project')}: ${esc((state.output.text || '').slice(0, 140))}</div>`;
  body.innerHTML = html;
}

function renderVault() {
  const body = document.getElementById('vaultBody');
  document.getElementById('vaultCount').textContent = state.vault.length;
  document.getElementById('undoVaultBtn').style.display = state.deletedVault.length ? 'inline-block' : 'none';
  if (!state.vault.length) {
    body.innerHTML = '<div class="output-empty">বাড়তি ফাইল এখানে জমবে</div>';
    return;
  }
  body.innerHTML = state.vault.map((v, i) => `
    <div class="vault-item" onclick="restoreFromVault(${i})">
      <span class="vault-name">${esc(v.title || 'Sample #' + (i + 1))}</span>
      <button class="icon-btn" style="font-size:11px;" onclick="event.stopPropagation();deleteVaultItem(${i})">✕</button>
    </div>`).join('');
}

function openPopover(title, html, wide = false) {
  document.getElementById('popTitle').textContent = title;
  document.getElementById('popContent').innerHTML = html;
  document.getElementById('popCard').className = 'popover-card' + (wide ? ' wide' : '');
  document.getElementById('popBackdrop').classList.add('open');
}

function closePopover() {
  document.getElementById('popBackdrop').classList.remove('open');
}

function onDotClick(agentId, idx) {
  const s = state.agents[agentId].slots[idx];
  if (s && s.status === 'error') {
    openPopover(`${agentId.toUpperCase()} Key #${idx + 1} সমস্যা`, `
      <div class="wf-item err" style="margin-bottom:10px;">${esc(s.error || 'API Key কাজ করছে না বা লিমিট শেষ হয়েছে।')}</div>
      <div class="row-gap">
        <button class="btn-chip recover" onclick="runSelfRecovery('${agentId}')">⚡ Self-Recovery চালাও</button>
        <button class="btn-chip" onclick="openApiPopover('${agentId}')">Settings খোলো</button>
      </div>`);
  } else {
    openApiPopover(agentId);
  }
}

function openApiPopover(agentId) {
  const slots = state.agents[agentId].slots;
  const tabs = AGENT_META.map(a =>
    `<button class="btn-chip ${a.id === agentId ? 'active' : ''}" onclick="openApiPopover('${a.id}')">${a.name}</button>`
  ).join('');
  const cards = slots.map((s, i) => `
    <div class="key-card">
      <div class="api-row-top" style="margin-bottom:6px;">
        <span>Key #${i + 1} ${i === 0 ? '(Primary)' : '(Backup)'} <span class="tier-tag ${s.tier==='Max'?'max':s.tier==='High'?'high':'med'}">${s.tier}</span></span>
        <span class="dot ${!s.key?'':s.status==='working'?'blue':s.status==='error'?'red':'green'}"></span>
      </div>
      <input class="field-input" type="password" placeholder="API Key পেস্ট করো..." value="${esc(s.key)}" oninput="updateSlot('${agentId}',${i},'key',this.value)" />
      <div class="row-gap">
        <select class="field-select" style="flex:1;" onchange="updateSlot('${agentId}',${i},'provider',this.value)">
          ${['openrouter','google','openai','groq','deepseek','mistral','elevenlabs','fal','replicate','custom'].map(p =>
            `<option value="${p}" ${s.provider===p?'selected':''}>${p}</option>`).join('')}
        </select>
        <button class="btn-chip active" onclick="autoDetectSlot('${agentId}',${i})">Auto-Detect</button>
      </div>
      ${s.provider === 'custom' ? `<input class="field-input" style="margin-top:6px;" placeholder="Custom Base URL (https://...)" value="${esc(s.customUrl)}" oninput="updateSlot('${agentId}',${i},'customUrl',this.value)" />` : ''}
      <label class="field-label">Model (${s.models.length || 0}টি পাওয়া গেছে)</label>
      <input class="field-input" list="mlist-${agentId}-${i}" value="${esc(s.model)}" placeholder="Model name..." oninput="updateSlot('${agentId}',${i},'model',this.value)" />
      <datalist id="mlist-${agentId}-${i}">${(s.models||[]).slice(0,120).map(m=>`<option value="${esc(m)}">`).join('')}</datalist>
      ${s.error ? `<div style="color:#fca5a5;font-size:10.5px;margin-top:4px;">⚠️ ${esc(s.error)}</div>` : ''}
      <div class="row-gap">
        ${i > 0 ? `<button class="btn-chip danger" onclick="removeSlot('${agentId}',${i})">Remove</button>` : ''}
      </div>
    </div>`).join('');

  openPopover(`API Settings · ${agentId.toUpperCase()}`, `
    <div class="row-gap" style="margin-top:0;margin-bottom:8px;">${tabs}</div>
    ${cards}
    <div class="row-gap">
      ${slots.length < 3 ? `<button class="btn-chip" onclick="addSlot('${agentId}')">+ Backup Key</button>` : ''}
      <button class="btn-chip" onclick="exportStudioBackup()">Backup JSON</button>
      <button class="btn-chip" onclick="importStudioBackup()">Restore</button>
    </div>
    <div class="mini-chat-box">
      <input class="field-input" id="miniChatIn" placeholder="${agentId} AI-কে সরাসরি প্রশ্ন করো..." />
      <button class="send-btn" onclick="sendMiniChat('${agentId}')">Ask</button>
    </div>
    <div id="miniChatOut" style="font-size:11px;color:#cbd5e1;margin-top:6px;white-space:pre-wrap;"></div>
  `, true);
}

function updateSlot(agentId, idx, field, val) {
  const s = state.agents[agentId].slots[idx];
  s[field] = val.trim();
  if (field === 'key') {
    s.status = s.key ? 'ready' : 'idle';
    s.error = '';
    const info = inferTierAndCaps(s.provider, s.model, agentId);
    s.tier = info.tier; s.caps = info.caps;
  } else if (field === 'model' || field === 'provider') {
    const info = inferTierAndCaps(s.provider, s.model, agentId);
    s.tier = info.tier; s.caps = info.caps;
  }
  saveState(); renderApiList(); renderCatMatrix(); updateTopDots();
  if (field === 'provider') openApiPopover(agentId);
}

function addSlot(agentId) {
  if (state.agents[agentId].slots.length < 3) {
    state.agents[agentId].slots.push(makeSlot());
    saveState(); openApiPopover(agentId);
  }
}

function removeSlot(agentId, idx) {
  state.agents[agentId].slots.splice(idx, 1);
  saveState(); renderApiList(); renderCatMatrix(); openApiPopover(agentId);
}

async function autoDetectSlot(agentId, idx) {
  const s = state.agents[agentId].slots[idx];
  if (!s.key) { alert('আগে API Key বসাও।'); return; }
  s.status = 'working'; renderApiList();
  try {
    const res = await fetch('/api/auto-detect-key', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ apiKey: s.key, provider: s.provider, customUrl: s.customUrl, agentId })
    }).then(r => r.json());
    if (!res.ok) {
      s.status = 'error'; s.error = res.error || 'Key ডিটেক্ট ব্যর্থ হয়েছে।';
      addNotif(agentId, `${agentId} Key #${idx+1}: ${s.error}`);
    } else {
      s.provider = res.provider || s.provider;
      s.models = res.models || [];
      let picked = res.auto_model || res.model || '';
      if (s.model && s.models.length > 1) {
        if (!s.triedModels.includes(s.model)) s.triedModels.push(s.model);
        const nextBest = s.models.find(m => !s.triedModels.includes(m));
        if (nextBest) picked = nextBest;
        else { s.triedModels = []; picked = res.auto_model || s.models[0]; }
      }
      s.model = picked;
      const info = inferTierAndCaps(s.provider, s.model, agentId);
      s.tier = info.tier; s.caps = info.caps;
      s.status = 'ready'; s.error = '';
      addWorkflow('Auto-Detect', `${agentId} Key #${idx+1} -> ${s.provider} / ${s.model} (${s.tier})`, 'ok');
    }
  } catch (e) {
    s.status = 'error'; s.error = 'সার্ভারের সাথে সংযোগ ব্যর্থ।';
    addNotif(agentId, `${agentId} Key #${idx+1} সংযোগ সমস্যা।`);
  }
  saveState(); renderApiList(); renderCatMatrix(); updateTopDots();
  if (document.getElementById('popBackdrop').classList.contains('open')) openApiPopover(agentId);
}

function addChatMsg(role, text, extra = {}) {
  const last = state.chat[state.chat.length - 1];
  if (last && last.role === role && last.text === text && !extra.choiceAsk && !extra.choiceCard) return;
  state.chat.push(Object.assign({ id: 'm' + Date.now() + Math.floor(Math.random()*999), role, text, time: nowTime() }, extra));
  if (state.chat.length > 60) state.chat.shift();

        <div class="msg-tools">
          <button class="mini-act primary" onclick="confirmChoiceAndRun()">🎬 কনফার্ম করে স্যাম্পল বানাও</button>
          <button class="mini-act" onclick="cancelPendingChoice()">বাতিল</button>

        <button class="mini-act" onclick="requestSampleRevision()">🔄 আরেকটা স্যাম্পল বানাও</button>

function isProductionIntent(text) {
  const t = text.toLowerCase();
  const isQuestion = /(\?|পারবে|ক্ষমতা|কয়টা|কজন|কীভাবে|কিভাবে|কে কে|চালু আছে|বলো তো|জানাও)/.test(t)
    && !/(বানাও|তৈরি কর|শুরু কর|স্যাম্পল দাও|create|generate|make a video|youtube\.com|youtu\.be)/.test(t);
  if (isQuestion) return false;
  return /(ভিডিও|বানাও|তৈরি|গল্প|স্ক্রিপ্ট|স্যাম্পল|অ্যানিমেশন|রিলস|শর্টস|থাম্বনেল|youtube\.com|youtu\.be|http|video|create|generate|make|scene|story)/.test(t);
}

function buildDynamicChoiceGroups() {
  const groups = [];
  const vSlot = getActiveSlot('video');
  const iSlot = getActiveSlot('image');
  const aSlot = getActiveSlot('audio');
  const eSlot = getActiveSlot('editing');

  if (vSlot && (vSlot.tier === 'Max' || vSlot.tier === 'High')) {
    groups.push({
      title: `Video (${vSlot.model || vSlot.provider})`,
      options: [
        { label: '1080p Full HD', checked: true },
        { label: '4K Ultra HD', checked: vSlot.tier === 'Max' },
        { label: '30 FPS', checked: false },
        { label: '60 FPS Smooth', checked: true },
        { label: 'Cinematic Motion', checked: true }
      ]
    });
  }
  if (iSlot && (iSlot.tier === 'Max' || iSlot.tier === 'High')) {
    groups.push({
      title: `Image / Visual (${iSlot.model || iSlot.provider})`,
      options: [
        { label: '3D Animation Style', checked: true },
        { label: '2D Anime / Cartoon', checked: false },
        { label: 'Ultra Detail Lighting', checked: true }
      ]
    });
  }
  if (aSlot && (aSlot.tier === 'Max' || aSlot.tier === 'High' || aSlot.provider === 'elevenlabs')) {
    groups.push({
      title: `Audio / Voice (${aSlot.provider})`,
      options: [
        { label: 'Bangla Natural Voice', checked: true },
        { label: 'Emotional Tone', checked: true },
        { label: 'Background Music + SFX', checked: true }
      ]
    });
  }
  if (eSlot && (eSlot.tier === 'Max' || eSlot.tier === 'High')) {
    groups.push({
      title: `Editing & Subtitles`,
      options: [
        { label: 'Auto Bangla Subtitles (CC)', checked: true },
        { label: 'Fast Reels Cut', checked: state.ratio === '9:16' }
      ]
    });
  }
  return groups;
}

async function runBackendJob(payload) {
  state.isBusy = true;
  updateTopDots();
  try {
    const start = await fetch('/api/start-job', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(r => r.json());
    if (!start.ok) throw new Error(start.error || 'জব শুরু করা যায়নি');
    state.activeJobId = start.job_id;
    while (state.activeJobId) {
      await new Promise(r => setTimeout(r, 900));
      if (!state.activeJobId) return { ok: false, cancelled: true };
      const poll = await fetch(`/api/job/${state.activeJobId}`).then(r => r.json());
      if (poll.status === 'done' || poll.status === 'error') {
        state.activeJobId = null;
        return poll.result || { ok: false, error: 'ফাঁকা রেসপন্স' };
      }
      if (poll.status === 'cancelled' || poll.status === 'not_found') {
        state.activeJobId = null;
        return { ok: false, cancelled: true };
      }
    }
    return { ok: false, cancelled: true };
  } catch (e) {
    return { ok: false, error: e.message || 'সার্ভার এরর' };
  } finally {
    state.isBusy = false;
    state.activeJobId = null;
    AGENT_META.forEach(a => setAgentWorking(a.id, false));
    updateTopDots();
  }
}

async function runProductionFlow(prompt, choiceText, stage) {
  const team = getTeamSummary();
  const tasks = [];
  const dConf = buildBackendConfig('director');

  setAgentWorking('director', true, ['TXT']);
  addWorkflow('Peer Handshake', `Director AI (${stage}) টিমের সাথে পরিকল্পনা ভাগ করছে...`, 'work');

  const specs = `Stage: ${stage}\nAspect Ratio: ${state.ratio}\nSubtitles: ${state.cc ? 'ON' : 'OFF'}\n${choiceText ? 'Selected Options:\n' + choiceText : ''}`;
  tasks.push({
    agent_id: 'director', agent_name: 'Director AI', config: dConf, co_work: state.cowork,
    system_prompt: `তুমি AI Video Studio-এর Director AI। প্রথমে ${stage} তৈরি করো। বাংলায় সুন্দর স্ক্রিপ্ট, সিন-বাই-সিন প্ল্যান ও থাম্বনেল আইডিয়া দাও।\nটিম:\n${team.text}`,
    prompt: `${prompt}\n\n${specs}`
  });

  ['image', 'video', 'audio', 'editing'].forEach(id => {
    const conf = buildBackendConfig(id);
    if (conf) {
      const capMap = { image: ['IMG'], video: ['VID'], audio: ['AUD'], editing: ['EDT'] };
      setAgentWorking(id, true, capMap[id]);
      tasks.push({
        agent_id: id, agent_name: id.toUpperCase() + ' AI', config: conf, co_work: state.cowork,
        system_prompt: `তুমি স্টুডিওর ${id.toUpperCase()} AI। Director AI-এর সাথে মিল রেখে এই ${stage}-এর জন্য তোমার অংশের নিখুঁত প্রম্পট/প্ল্যান সংক্ষেপে দাও।`,
        prompt: `${prompt}\n\n${specs}`
      });
    }
  });

  const res = await runBackendJob({ type: 'multi', tasks, project_memory: state.characterLock });
  if (res.cancelled) { addWorkflow('Stopped', 'প্রোডাকশন থামানো হয়েছে।', 'warn'); return; }
  if (!res.ok || !res.results) {
    markAgentError('director', res.error || 'প্রোডাকশন জব ব্যর্থ হয়েছে');
    addChatMsg('ai', '⚠️ প্রোডাকশন চালাতে সমস্যা হয়েছে। নোটিফিকেশন বার থেকে Self-Recovery চাপো।');
    return;
  }

  let combinedText = '';
  let directorText = '';
  res.results.forEach(r => {
    if (!r.ok) {
      markAgentError(r.agent_id || 'director', r.error || 'মডেল এরর');
    } else {
      addWorkflow(r.agent_name || r.agent_id, (r.text || '').slice(0, 110) + '...', 'ok');
      if (r.agent_id === 'director') directorText = r.text || '';
      combinedText += `\n[${r.agent_name}]\n${r.text || ''}\n`;
    }
  });

  if (state.output) {
    state.vault.unshift(state.output);
    if (state.vault.length > 25) state.vault.pop();
  }

  const cleanTitle = prompt.slice(0, 32) + (prompt.length > 32 ? '...' : '');
  const newOut = {
    id: 'out_' + Date.now(),
    title: cleanTitle,
    prompt,
    choiceText,
    stage,
    ratio: state.ratio,
    text: directorText || combinedText.trim() || 'আউটপুট তৈরি হয়েছে।',
    fullLog: combinedText.trim(),
    imgUrl: '',
    audioUrl: '',
    videoUrl: '',
    time: nowTime()
  };

  // Optional ElevenLabs real sample audio if Audio agent uses elevenlabs
  const aSlot = getActiveSlot('audio');
  if (aSlot && aSlot.provider === 'elevenlabs' && aSlot.key && directorText) {
    try {
      setAgentWorking('audio', true, ['AUD']);
      const tts = await fetch('/api/elevenlabs/tts', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apiKey: aSlot.key, text: directorText.slice(0, 220), model: aSlot.model || 'eleven_multilingual_v2' })
      }).then(r => r.json());
      if (tts.ok && tts.audio_base64) {
        newOut.audioUrl = tts.audio_base64;
        addWorkflow('Audio AI', 'ElevenLabs ভয়েস স্যাম্পল যুক্ত হয়েছে।', 'ok');
      }
    } catch (e) {}
    setAgentWorking('audio', false);
  }

  state.output = newOut;
  renderOutput(); renderVault(); updateTopDots(); saveState();

  const note = stage === 'Sample'
    ? `\n\n✅ স্যাম্পল তৈরি হয়ে ওপরের Output বক্সে এসেছে। পছন্দ হলে নিচের Approve বাটনে চাপো, আর বদলাতে চাইলে আগেরটা Vault-এ সেভ হয়ে নতুন স্যাম্পল তৈরি হবে।`
    : `\n\n🎬 ফাইনাল প্রোডাকশন প্রস্তুত! Output বক্সের MP4 বাটনে চাপ দিয়ে সরাসরি ভিডিও এক্সপোর্ট করো।`;
  addChatMsg('ai', (directorText || 'কাজ সম্পন্ন হয়েছে।') + note, { sampleReady: stage === 'Sample' });
}

async function runSelfRecovery(targetAgentId = null) {
  const targets = targetAgentId ? [targetAgentId] : AGENT_META.map(a => a.id);
  let recoveredAny = false;
  addWorkflow('Self-Recovery', 'সিস্টেম নিজে থেকে সমস্যা শনাক্ত ও সমাধানের চেষ্টা করছে...', 'work');

  if (state.isBusy) await cancelActiveJob();

  for (const id of targets) {
    const slots = state.agents[id].slots;
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (!s.key || s.status !== 'error') continue;

      // 1. Try next model in same key
      if (s.models && s.models.length > 1) {
        if (!s.triedModels.includes(s.model)) s.triedModels.push(s.model);
        const nextM = s.models.find(m => !s.triedModels.includes(m));
        if (nextM) {
          s.model = nextM;
          s.status = 'ready';
          s.error = '';
          const info = inferTierAndCaps(s.provider, s.model, id);
          s.tier = info.tier; s.caps = info.caps;
          addWorkflow('Self-Recovery', `${id.toUpperCase()} Key #${i+1}-এ নতুন মডেল (${nextM}) সেট করা হয়েছে।`, 'ok');
          recoveredAny = true;
          continue;
        }
      }

      // 2. Try switching to another backup slot in same agent
      const backup = slots.find((b, bi) => bi !== i && b.key && b.status !== 'error');
      if (backup) {
        s.status = 'warn';
        addWorkflow('Self-Recovery', `${id.toUpperCase()}-এর ব্যাকআপ Key চালু করা হয়েছে।`, 'ok');
        recoveredAny = true;
        continue;
      }

      // 3. Fallback to Director or another active agent
      const fallbackAgent = AGENT_META.find(a => a.id !== id && getActiveSlot(a.id) && getActiveSlot(a.id).status !== 'error');
      if (fallbackAgent) {
        s.status = 'warn';
        addWorkflow('Self-Recovery', `${id.toUpperCase()}-এর কাজ সামলাতে ${fallbackAgent.name} AI-কে ফলব্যাক করা হয়েছে।`, 'ok');
        recoveredAny = true;
      }
    }
  }

  state.notifs.forEach(n => {
    if (!targetAgentId || n.agentId === targetAgentId) n.resolved = recoveredAny;
  });
  if (recoveredAny) {
    addChatMsg('sys', '⚡ Self-Recovery সম্পন্ন: সমস্যাযুক্ত মডেল/Key অটো-সুইচ করে স্টুডিও আবার প্রস্তুত করা হয়েছে।');
  } else {
    addChatMsg('sys', '⚠️ Self-Recovery চালানো হয়েছে, তবে সচল ব্যাকআপ Key বা মডেল পাওয়া যায়নি। দয়া করে নতুন API Key দাও।');
  }
  saveState(); renderApiList(); renderCatMatrix(); renderNotifs(); updateTopDots();
  closePopover();
}

async function autoExtractLock() {
  const conf = buildBackendConfig('director');

  addWorkflow('Continuity Lock', 'Character Bible তৈরি হচ্ছে...', 'work');
  try {
    const res = await fetch('/api/extract-continuity', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config: conf, existing_memory: state.characterLock, latest_context: ctx })
    }).then(r => r.json());
    if (res.ok && res.memory) {
      state.characterLock = res.memory;
      saveState(); updateTopDots(); openLockPopover();

  } catch (e) { alert('সার্ভার সংযোগ ব্যর্থ।'); }
}

function importStudioBackup() {

  inp.onchange = e => {
    const f = e.target.files?.[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
        loadState();
        initUI();
        closePopover();
        addWorkflow('Restore', 'স্টুডিও ব্যাকআপ সফলভাবে রিস্টোর হয়েছে।', 'ok');

    };
    reader.readAsText(f);
  };
  inp.click();
}

    alert('এই ব্রাউজার লাইভ ভিডিও রেন্ডারিং সাপোর্ট করে না। Chrome বা আধুনিক ব্রাউজার ব্যবহার করো।');
    return;
  }

  addWorkflow('MP4 Render', `সরাসরি .mp4 ভিডিও (${state.ratio}) রেন্ডার হচ্ছে...`, 'work');
  const w = state.ratio === '9:16' ? 720 : 1280;
  const h = state.ratio === '9:16' ? 1280 : 720;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  const lines = (state.output.text || state.output.title || 'AI Video Studio')
    .replace(/\s+/g, ' ').trim().match(/.{1,42}(\s|$)/g) || ['AI Video Studio'];

  const stream = canvas.captureStream(30);
  const mime = MediaRecorder.isTypeSupported('video/mp4;codecs=avc1')
    ? 'video/mp4;codecs=avc1'
    : MediaRecorder.isTypeSupported('video/mp4')
      ? 'video/mp4'
      : 'video/webm;codecs=vp8';

  const chunks = [];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 2500000 });
  rec.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ai-studio-${Date.now()}.mp4`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    addWorkflow('MP4 Ready', 'ভিডিও (.mp4) সফলভাবে ডাউনলোড হয়েছে।', 'ok');
  };

  rec.start();
  const durationMs = 4500;
  const startTs = performance.now();

  function drawFrame(now) {
    const elapsed = now - startTs;
    const p = Math.min(1, elapsed / durationMs);

    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, '#09111f');
    grad.addColorStop(0.5, '#13243f');
    grad.addColorStop(1, '#070b14');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    // Subtle animated glow circle
    ctx.fillStyle = 'rgba(56, 189, 248, 0.14)';
    ctx.beginPath();
    ctx.arc(w * (0.25 + 0.5 * p), h * 0.38, Math.min(w, h) * 0.28, 0, Math.PI * 2);
    ctx.fill();

    // Title
    ctx.fillStyle = '#38bdf8';
    ctx.font = `bold ${Math.round(w * 0.032)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(`AI VIDEO STUDIO · ${state.output.stage || 'SAMPLE'}`, w / 2, h * 0.18);

    ctx.fillStyle = '#f8fafc';
    ctx.font = `bold ${Math.round(w * 0.044)}px sans-serif`;
    ctx.fillText((state.output.title || 'Studio Render').slice(0, 36), w / 2, h * 0.45);

    // Optional Subtitles (CC)
    if (state.cc) {
      const idx = Math.min(lines.length - 1, Math.floor(p * Math.min(lines.length, 4)));
      const sub = (lines[idx] || '').trim();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(w * 0.08, h * 0.78, w * 0.84, h * 0.12);
      ctx.fillStyle = '#fef08a';
      ctx.font = `600 ${Math.round(w * 0.028)}px sans-serif`;
      ctx.fillText(sub, w / 2, h * 0.855);
    }

    if (elapsed < durationMs) requestAnimationFrame(drawFrame);
    else rec.stop();
  }
  requestAnimationFrame(drawFrame);
}

function initUI() {
  applyToolsDrawer();
  renderApiList();
  renderCatMatrix();
  renderChat();
  renderWorkflow();
  renderNotifs();
  renderOutput();
  renderVault();
  updateTopDots();
}

loadState();
initUI();
</script>
</body>
