<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AI Video Studio</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #172033;
    --border: #243047;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .app-shell {
    display: flex; flex-direction: column; height: 100dvh; width: 100%;
    padding: 6px; gap: 6px;
  }

  /* Top Bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 10px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; letter-spacing: 0.2px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .top-actions { display: flex; gap: 6px; align-items: center; }
  .btn-chip {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: 0.15s;
  }
  .btn-chip:active { transform: scale(0.96); }
  .btn-chip.active { border-color: var(--accent); background: var(--accent-soft); color: #fff; }
  .btn-chip.locked { border-color: var(--green); color: var(--green); }
  .btn-chip.danger { border-color: rgba(239,68,68,0.45); color: #fca5a5; }

  /* 6-Box Workspace matching sketch */
  .workspace {
    flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px;
  }
  .upper-row {
    flex: 1.25; min-height: 0; display: grid;
    grid-template-columns: 1.65fr 1fr; gap: 6px;
  }
  .lower-row {
    flex: 1; min-height: 0; display: grid;
    grid-template-columns: 1fr 1.25fr 0.62fr; gap: 6px;
  }

  /* Common Box Card */
  .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; position: relative;
  }
  .box-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02); flex-shrink: 0;
  }
  .box-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #475569; display: inline-block; flex-shrink: 0; }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1.4s infinite; }
  .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); animation: pulse 1.2s infinite; }
  .dot.blue { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .icon-btn {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 6px;
  }
  .icon-btn:hover, .icon-btn:active { background: var(--panel-2); color: var(--text); }

  /* Box 1: Director Chat */
  .chat-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
  }
  .msg {
    max-width: 92%; padding: 8px 10px; border-radius: 10px;
    line-height: 1.45; word-wrap: break-word; font-size: 12.5px; white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end; background: #1d4ed8; color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.ai {
    align-self: flex-start; background: var(--panel-2);
    border: 1px solid var(--border); border-bottom-left-radius: 3px;
  }
  .msg.sys {
    align-self: center; background: rgba(56,189,248,0.08);
    border: 1px dashed rgba(56,189,248,0.35); color: #bae6fd;
    font-size: 11px; padding: 5px 9px; text-align: center;
  }
  .msg-tools {
    display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; align-items: center;
  }
  .mini-act {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .mini-act.primary { background: var(--accent); color: #06101c; border-color: var(--accent); font-weight: 600; }
  .mini-act.speaking { background: var(--red); border-color: var(--red); color: #fff; }

  .chat-input-wrap {
    display: flex; gap: 5px; padding: 6px; border-top: 1px solid var(--border);
    background: var(--panel); align-items: center; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12.5px; outline: none; min-width: 0;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent); color: #06101c; border: none; border-radius: 8px;
    padding: 7px 11px; font-weight: 700; font-size: 12px; cursor: pointer;
  }

  /* 4 Category Alert Strip below Chat (inside Box 1 bottom) */
  .cat-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 4px 6px 6px; border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.22); flex-shrink: 0;
  }
  .cat-pill {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 5px; display: flex; align-items: center; justify-content: center;
    gap: 4px; font-size: 10px; color: var(--muted); cursor: pointer;
  }
  .cat-pill.has-alert { border-color: var(--yellow); color: #fde68a; background: rgba(245,158,11,0.12); }

  /* Right Upper Column: Box 2 (Output) + Box 3 (Extra/Vault) */
  .right-upper { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .box-output { flex: 1.25; }
  .box-vault { flex: 0.85; }

  .output-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: center;
  }
  .output-body.has-content { justify-content: flex-start; align-items: stretch; }
  .output-empty { color: var(--muted); font-size: 11px; text-align: center; opacity: 0.75; }
  .output-img { width: 100%; max-height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .output-text-snippet { font-size: 11px; color: #cbd5e1; line-height: 1.35; max-height: 70px; overflow: hidden; }
  .output-pulse {
    width: 100%; height: 4px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: none;
  }
  .output-pulse.active { display: block; }
  .output-pulse::after {
    content: ""; display: block; width: 45%; height: 100%; background: var(--accent);
    animation: slide 1.1s infinite ease-in-out;
  }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .output-foot {
    display: flex; gap: 4px; padding: 4px 6px; border-top: 1px solid var(--border);
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }

  /* Box 3: Extra / Vault */
  .vault-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 5px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .vault-item {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 6px; font-size: 10.5px; cursor: pointer;
  }
  .vault-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* Box 4: API Control */
  .api-list {
    flex: 1; min-height: 0; overflow-y: auto; padding: 5px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .api-row {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .api-row-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; }
  .api-row-sub { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Box 5: Workflow Feed */
  .disturb-bar {
    padding: 4px 8px; font-size: 10.5px; display: flex; align-items: center; justify-content: space-between;
    background: rgba(34,197,94,0.08); color: #86efac; border-bottom: 1px solid var(--border);
    cursor: pointer; flex-shrink: 0;
  }
  .disturb-bar.error { background: rgba(239,68,68,0.18); color: #fecaca; border-bottom-color: var(--red); }
  .wf-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 5px; scroll-behavior: smooth;
  }
  .wf-item {
    background: var(--panel-2); border-left: 2px solid var(--accent);
    border-radius: 6px; padding: 5px 7px; font-size: 11px; line-height: 1.35;
  }
  .wf-item.ok { border-left-color: var(--green); }
  .wf-item.warn { border-left-color: var(--yellow); }
  .wf-item.err { border-left-color: var(--red); }
  .wf-meta { font-size: 9.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }

  /* Box 6: Standby Toolbox */
  .toolbox-body {
    flex: 1; min-height: 0; padding: 6px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-align: center;
  }
  .toolbox-slot {
    width: 100%; border: 1px dashed var(--border); border-radius: 9px;
    padding: 10px 4px; color: var(--muted); font-size: 10.5px; transition: 0.2s;
  }
  .toolbox-slot.active {
    border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: #e0f2fe;
  }

  /* Compact Floating Popover (for Toolbox, Alerts, Disturb) */
  .popover-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 14px;
  }
  .popover-backdrop.open { display: flex; }
  .popover-card {
    width: 100%; max-width: 340px; max-height: 80dvh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.6);
  }
  .popover-card.wide { max-width: 460px; }
  .pop-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 13px;
  }
  .field-label { font-size: 11px; color: var(--muted); margin: 7px 0 3px; display: block; }
  .field-input, .field-select, .field-textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12px; outline: none;
  }
  .field-textarea { min-height: 75px; resize: vertical; }
  .row-gap { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .key-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px; margin-bottom: 8px;
  }
  audio { width: 100%; height: 32px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span> AI Video Studio</div>
    <div class="top-actions">
      <button class="btn-chip" id="btnLock" onclick="openLockPopover()" title="Character Lock">Lock</button>
      <button class="btn-chip" id="btnSave" onclick="saveCurrentProject()" title="Save">Save</button>
      <button class="btn-chip" id="btnFiles" onclick="openFilesPopover()" title="Files">Files</button>
      <button class="btn-chip" id="btnPause" onclick="cancelActiveJob()" title="Stop Job">Stop</button>
    </div>
  </header>

  <!-- 6-Box Layout -->
  <main class="workspace">

    <!-- Upper Row: Box 1 (Chat) + Box 2 (Output) & Box 3 (Vault) -->
    <section class="upper-row">

      <!-- Box 1: Director AI Chat -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot green" id="directorDot"></span> Director AI</div>
          <div>
            <button class="icon-btn" onclick="openChatFull()" title="Expand">⤢</button>
            <button class="icon-btn" onclick="clearChat()" title="Clear">🗑</button>
          </div>
        </div>
        <div class="chat-feed" id="chatFeed"></div>
        <div class="chat-input-wrap">
          <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice">🎤</button>
          <input class="chat-input" id="chatInput" placeholder="গল্প বা নির্দেশ লেখো..." onkeydown="if(event.key==='Enter')sendChat()" />
          <button class="send-btn" onclick="sendChat()">Send</button>
        </div>
        <!-- 4 Read-Only Category Alert Indicators -->
        <div class="cat-strip">
          <div class="cat-pill" id="pill-image" onclick="openAlertPopover('image')"><span class="dot" id="adot-image"></span>Image</div>
          <div class="cat-pill" id="pill-video" onclick="openAlertPopover('video')"><span class="dot" id="adot-video"></span>Video</div>
          <div class="cat-pill" id="pill-audio" onclick="openAlertPopover('audio')"><span class="dot" id="adot-audio"></span>Audio</div>
          <div class="cat-pill" id="pill-editing" onclick="openAlertPopover('editing')"><span class="dot" id="adot-editing"></span>Edit</div>
        </div>
      </div>

      <!-- Right Upper Stack: Box 2 (Output) + Box 3 (Vault) -->
      <div class="right-upper">
        <!-- Box 2: Output -->
        <div class="box box-output">
          <div class="box-head">
            <div class="box-title"><span class="dot" id="outDot"></span> Output</div>
            <button class="icon-btn" onclick="openOutputPopover()" title="View Full">⤢</button>
          </div>
          <div class="output-pulse" id="outPulse"></div>
          <div class="output-body" id="outBody">
            <div class="output-empty">স্যাম্পল বা ফাইনাল আউটপুট এখানে দেখাবে</div>
          </div>
          <div class="output-foot">
            <span id="outTag" style="font-size:10px;color:var(--muted);">Standby</span>
            <button class="btn-chip" style="padding:3px 7px;" onclick="downloadCurrentOutput()">Download</button>
          </div>
        </div>

        <!-- Box 3: Extra / Trash Vault -->
        <div class="box box-vault">
          <div class="box-head">
            <div class="box-title">Vault (<span id="vaultCount">0</span>)</div>
            <button class="icon-btn" onclick="openVaultPopover()" title="Open Vault">⤢</button>
          </div>
          <div class="vault-body" id="vaultBody">
            <div class="output-empty">বাড়তি ফাইল এখানে জমবে</div>
          </div>
        </div>
      </div>

    </section>

    <!-- Lower Row: Box 4 (API) + Box 5 (Workflow) + Box 6 (Toolbox) -->
    <section class="lower-row">

      <!-- Box 4: API Control -->
      <div class="box">
        <div class="box-head">
          <div class="box-title">API Keys</div>
          <button class="icon-btn" onclick="openApiPopover('director')" title="Settings">⚙</button>
        </div>
        <div class="api-list" id="apiList"></div>
      </div>

      <!-- Box 5: Live Workflow -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot" id="wfDot"></span> Workflow</div>
          <button class="icon-btn" onclick="clearWorkflow()" title="Clear">🗑</button>
        </div>
        <div class="disturb-bar" id="disturbBar" onclick="openDisturbPopover()">
          <span id="disturbLabel">System OK</span>
          <span id="coworkBadge" style="font-size:9.5px;opacity:0.85;">Solo</span>
        </div>
        <div class="wf-feed" id="wfFeed"></div>
      </div>

      <!-- Box 6: Standby Toolbox -->
      <div class="box">
        <div class="box-head">
          <div class="box-title">Tools</div>
        </div>
        <div class="toolbox-body" onclick="openToolboxPopover()">
          <div class="toolbox-slot" id="toolboxSlot">
            <div id="toolboxIcon" style="font-size:16px;margin-bottom:3px;">+</div>
            <div id="toolboxText">Standby</div>
          </div>
        </div>
      </div>

    </section>

  </main>
</div>

<!-- Compact Floating Popover Container -->
<div class="popover-backdrop" id="popBackdrop" onclick="if(event.target===this)closePopover()">
  <div class="popover-card" id="popCard">
    <div class="pop-head">
      <span id="popTitle">Panel</span>
      <button class="icon-btn" onclick="closePopover()">✕</button>
    </div>
    <div id="popContent"></div>
  </div>
</div>
 <script>
const AGENTS = [
  { id: "director", name: "Director AI", role: "Lead & Chat" },
  { id: "image", name: "Image AI", role: "Visuals" },
  { id: "video", name: "Video AI", role: "Motion" },
  { id: "audio", name: "Audio AI", role: "Voice & SFX" },
  { id: "editing", name: "Editing AI", role: "Cut & Sub" }
];

const PROVIDERS = ["google", "openrouter", "groq", "openai", "anthropic", "deepseek", "mistral", "elevenlabs", "runway", "custom"];

const STORE_KEY = "ai_studio_v10_state";
let state = loadState();
let activeJobId = null;
let handledJobs = new Set();
let speakingBtn = null;
let recognition = null;
let isListening = false;

function defaultAgentCfg() {
  return {
    status: "idle",
    customUrl: "",
    keys: [
      { provider: "google", model: "", apiKey: "", subKey: "", models: [], status: "idle", lastMsg: "" },
      { provider: "openrouter", model: "", apiKey: "", subKey: "", models: [], status: "idle", lastMsg: "" }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  const agents = {};
  AGENTS.forEach(a => agents[a.id] = defaultAgentCfg());
  return {
    agents,
    chat: [
      {
        id: "welcome",
        role: "ai",
        text: "হ্যালো! আমি তোমার Director AI। নিচে API Keys বক্সে গিয়ে অন্তত Director-এর Key বসাও—কোম্পানি ও সেরা মডেল অটো-সেট হয়ে যাবে। এরপর এখানে সরাসরি কথা বলো বা যেকোনো ভিডিও প্রজেক্ট শুরু করো।"
      }
    ],
    workflow: [],
    disturbs: [],
    alerts: { image: [], video: [], audio: [], editing: [] },
    output: null,
    vault: [],
    savedProjects: [],
    memory: "",
    coWork: false,
    pendingProject: null,
    suggestedTool: null
  };
}

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
}

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function nowTime() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

/* ---------- RENDER FUNCTIONS ---------- */
function renderAll() {
  renderChat();
  renderApiList();
  renderWorkflow();
  renderOutput();
  renderVault();
  renderAlerts();
  renderDisturbBar();
  renderToolbox();
  const lockBtn = document.getElementById("btnLock");
  lockBtn.classList.toggle("locked", !!(state.memory && state.memory.trim()));
  lockBtn.textContent = state.memory ? "Locked" : "Lock";
}

function renderChat() {
  const feed = document.getElementById("chatFeed");
  feed.innerHTML = "";
  state.chat.forEach((m, idx) => {
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : m.role === "sys" ? "sys" : "ai");
    div.textContent = m.text;

    if (m.role === "ai") {
      const tools = document.createElement("div");
      tools.className = "msg-tools";

      const spk = document.createElement("button");
      spk.className = "mini-act";
      spk.textContent = "🔊";
      spk.onclick = () => toggleSpeak(m.text, spk);
      tools.appendChild(spk);

      const cp = document.createElement("button");
      cp.className = "mini-act";
      cp.textContent = "Copy";
      cp.onclick = () => { navigator.clipboard?.writeText(m.text); cp.textContent = "Copied"; setTimeout(() => cp.textContent = "Copy", 1200); };
      tools.appendChild(cp);

      if (m.actions && m.actions.length) {
        m.actions.forEach(act => {
          const b = document.createElement("button");
          b.className = "mini-act" + (act.primary ? " primary" : "");
          b.textContent = act.label;
          b.onclick = () => handleChatAction(act.type, act.payload, idx);
          tools.appendChild(b);
        });
      }
      div.appendChild(tools);
    }
    feed.appendChild(div);
  });
  feed.scrollTop = feed.scrollHeight;
}

function renderApiList() {
  const box = document.getElementById("apiList");
  box.innerHTML = "";
  AGENTS.forEach(a => {
    const cfg = state.agents[a.id] || defaultAgentCfg();
    const activeSlots = (cfg.keys || []).filter(k => (k.apiKey || "").trim());

/* ---------- TTS WITH INSTANT STOP ---------- */
function toggleSpeak(text, btn) {
  if (!("speechSynthesis" in window)) return;
  if (speakingBtn === btn && window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove("speaking");
    btn.textContent = "🔊";
    speakingBtn = null;
    return;
  }
  window.speechSynthesis.cancel();
  if (speakingBtn) {
    speakingBtn.classList.remove("speaking");
    speakingBtn.textContent = "🔊";
  }
  const u = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, ""));
  u.lang = /[\u0980-\u09FF]/.test(text) ? "bn-IN" : "en-US";
  u.onend = u.onerror = () => {
    btn.classList.remove("speaking");
    btn.textContent = "🔊";
    if (speakingBtn === btn) speakingBtn = null;
  };
  speakingBtn = btn;
  btn.classList.add("speaking");
  btn.textContent = "⏹";
  window.speechSynthesis.speak(u);
}

/* ---------- VOICE INPUT ---------- */
function toggleVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("এই ব্রাউজারে ভয়েস টাইপিং সাপোর্ট নেই।"); return; }
  const btn = document.getElementById("micBtn");
  if (isListening && recognition) { recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = "bn-IN";
  recognition.onstart = () => { isListening = true; btn.style.color = "var(--red)"; };
  recognition.onend = () => { isListening = false; btn.style.color = ""; };
  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript;
    const inp = document.getElementById("chatInput");
    inp.value = (inp.value ? inp.value + " " : "") + t;
  };
  recognition.start();
}

/* ---------- ZERO-REPEAT SEQUENTIAL POLLING ---------- */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runBackendJob(payload) {
  const startRes = await fetch("/api/start-job", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const startData = await startRes.json();
  if (!startData.ok || !startData.job_id) {
    return { ok: false, error: startData.error || "Job শুরু করা যায়নি।" };
  }
  const jobId = startData.job_id;
  activeJobId = jobId;

  for (let i = 0; i < 90; i++) {
    await sleep(1100);
    if (activeJobId !== jobId) return { ok: false, cancelled: true };
    const r = await fetch(`/api/job/${jobId}`);
    const d = await r.json();
    if (!d.ok) return { ok: false, error: "Job পাওয়া যায়নি।" };
    if (d.status === "cancelled") return { ok: false, cancelled: true };
    if (d.status === "done" || d.status === "error") {
      if (handledJobs.has(jobId)) return { ok: false, duplicate: true };
      handledJobs.add(jobId);
      if (activeJobId === jobId) activeJobId = null;
      return d.result || { ok: false, error: "ফাঁকা উত্তর এসেছে।" };
    }
  }
  return { ok: false, error: "সার্ভার থেকে উত্তর আসতে বেশি সময় লাগছে।" };
}

async function cancelActiveJob() {
  if (!activeJobId) return;
  const jid = activeJobId;
  activeJobId = null;
  setOutputLoading(false);
  try { await fetch(`/api/cancel-job/${jid}`, { method: "POST" }); } catch (e) {}
  addWorkflow("User", "Studio", "চলমান কাজ বন্ধ করা হয়েছে।", "warn");
  pushChat("sys", "কাজটি থামানো হয়েছে।");
}

async function generateProjectSample(promptText, useCoWork) {
  state.coWork = !!useCoWork;
  saveState();
  renderWorkflow();

  if (state.output) moveOutputToVault("Previous");

  pushChat("sys", "একটা স্যাম্পল তৈরি করা হচ্ছে, দেখে নিন...");
  addWorkflow("Director AI", "Team", `স্যাম্পল প্রস্তুতি শুরু (${state.coWork ? "Co-Work" : "Solo"}): ${promptText.slice(0, 70)}`);
  setOutputLoading(true);

  const tasks = [
    {
      agent_id: "director",
      agent_name: "Director AI",
      config: getDirectorConfig(),
      system_prompt: "Create a crisp, clean Bangla + English visual sample plan (2 key frames, mood, short dialogue) without messy markdown.",
      prompt: `Create a short sample preview for: ${promptText}`,
      co_work: state.coWork
    }
  ];

  ["image", "video", "audio", "editing"].forEach(id => {
    if (hasKey(id)) {
      const a = AGENTS.find(x => x.id === id);
      tasks.push({
        agent_id: id,
        agent_name: a.name,
        config: state.agents[id],
        system_prompt: `You are ${a.name}. Give a concise 2-line sample contribution for the Director.`,
        prompt: `Sample input for project: ${promptText}`,
        co_work: false
      });
    }
  });

  const res = await runBackendJob({
    type: "multi",
    tasks,
    project_memory: state.memory
  });

  if (res.cancelled || res.duplicate) { setOutputLoading(false); return; }

  const results = res.results || [];
  let leadText = "";
  let imgPrompt = promptText;

  results.forEach(r => {
    if (r.ok) {
      addWorkflow(r.agent_name, "Director AI", (r.text || "").slice(0, 110), "ok");
      if (r.agent_id === "director") leadText = r.text;
      if (r.agent_id === "image") imgPrompt = r.text.slice(0, 160);
      if (r.agent_id !== "director") addAlert(r.agent_id, `স্যাম্পল তৈরি হয়েছে: ${(r.text || "").slice(0, 90)}`);
    } else {
      addDisturb(r.agent_name, r.error || "Failed");
      addWorkflow(r.agent_name, "Director AI", "Error: " + (r.error || ""), "err");
      if (r.agent_id !== "director") addAlert(r.agent_id, "সার্ভার এরর: " + (r.error || ""));
    }
  });

  // Optional ElevenLabs sample audio if audio agent uses elevenlabs
  let audioData = "";
  const elKey = getElevenLabsKey();
  if (elKey && leadText) {
    try {
      addWorkflow("Director AI", "Audio AI", "ElevenLabs স্যাম্পল ভয়েস তৈরি হচ্ছে...");
      const tr = await fetch("/api/elevenlabs/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ apiKey: elKey, text: leadText.slice(0, 180) })
      });
      const td = await tr.json();
      if (td.ok && td.audio_base64) {
        audioData = td.audio_base64;
        addWorkflow("Audio AI", "Output", "স্যাম্পল অডিও রেডি।", "ok");
      }
    } catch (e) {}
  }

  // Suggest external tool only if design/graphic requested
  if (/thumbnail|poster|graphic|design|ডিজাইন|থাম্বনেইল|পোস্টার/i.test(promptText)) {
    state.suggestedTool = { name: "Canva", icon: "🎨", mode: "Optional", note: "গ্রাফিক্স ও থাম্বনেইল ফিনিশিং-এর জন্য কানেক্ট করতে পারো।" };
    renderToolbox();
  }

  state.output = {
    kind: "sample",
    prompt: promptText,
    text: leadText || "স্যাম্পল তৈরি হয়েছে।",
    imageUrl: buildVisualUrl(imgPrompt),
    audioData
  };
  saveState();
  setOutputLoading(false);
  renderOutput();

  pushChat(
    "ai",
    "স্যাম্পল তৈরি হয়ে গেছে—ডানদিকের Output বক্সে ছবি ও বিবরণ দেখে নাও। পছন্দ হলে ফাইনাল বানাই, অথবা বদলাতে চাইলে বলো।",
    [
      { label: "ঠিক আছে, ফাইনাল বানাও", type: "approve_final", primary: true },
      { label: "আরেকটা ভালো বানাও", type: "retry_sample" }
    ]
  );
}

  pushChat("sys", "এক্সপোর্ট করা হচ্ছে...");
  const content = `=== AI VIDEO STUDIO (${state.output.kind.toUpperCase()}) ===\nPrompt: ${state.output.prompt || ""}\n\n${state.output.text || ""}`;
  const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `AI-Studio-${state.output.kind}-${Date.now()}.txt`;
  a.click();
  setTimeout(() => pushChat("sys", "এক্সপোর্ট কমপ্লিট হয়েছে!"), 500);
}

function saveCurrentProject() {
  const title = (state.pendingProject?.prompt || state.output?.prompt || "Project " + nowTime()).slice(0, 36);
  state.savedProjects.unshift({
    id: "p_" + Date.now(),
    title,
    time: nowTime(),
    chat: state.chat.slice(-20),
    output: state.output,
    memory: state.memory
  });
  if (state.savedProjects.length > 15) state.savedProjects.pop();
  saveState();
  pushChat("sys", `প্রজেক্ট সেভ হয়েছে: "${title}" (Files-এ পাওয়া যাবে)`);
}

function clearChat() {
  if (!confirm("চ্যাট পরিষ্কার করবে?")) return;
  state.chat = [{ id: "c0", role: "ai", text: "নতুন সেশন শুরু হলো। কী বানাতে চাও বলো।" }];
  saveState();
  renderChat();
}

function clearWorkflow() {
  state.workflow = [];
  state.disturbs = [];
  saveState();
  renderWorkflow();
  renderDisturbBar();
}

function getElevenLabsKey() {
  const keys = state.agents.audio?.keys || [];
  for (const k of keys) {
    if ((k.apiKey || "").trim() && (k.provider === "elevenlabs" || k.apiKey.startsWith("sk_"))) return k.apiKey.trim();
  }
  return "";
}

/* ---------- COMPACT POPOVER SYSTEM ---------- */
function openPopover(title, html, wide = false) {
  document.getElementById("popTitle").textContent = title;
  document.getElementById("popContent").innerHTML = html;
  document.getElementById("popCard").classList.toggle("wide", wide);
  document.getElementById("popBackdrop").classList.add("open");
}
function closePopover() {
  document.getElementById("popBackdrop").classList.remove("open");
}

function openChatFull() {
  const lines = state.chat.map(m => `<div class="key-card"><b>${m.role === "user" ? "You" : "Director AI"}:</b><div style="margin-top:4px;white-space:pre-wrap;">${esc(m.text)}</div></div>`).join("");
  openPopover("Director AI Chat", lines || "Empty", true);
}

function openOutputPopover() {
  if (!state.output) { openPopover("Output", "<div class='output-empty'>কোনো আউটপুট নেই।</div>"); return; }
  const o = state.output;
  let html = "";
  if (o.imageUrl) html += `<img src="${esc(o.imageUrl)}" style="width:100%;border-radius:10px;margin-bottom:8px;" />`;
  if (o.audioData) html += `<audio controls src="${o.audioData}"></audio>`;
  html += `<div style="white-space:pre-wrap;font-size:12px;line-height:1.5;margin-top:8px;">${esc(o.text)}</div>`;
  html += `<div class="row-gap">
    <button class="btn-chip active" onclick="downloadCurrentOutput()">Download Text</button>
    ${o.imageUrl ? `<a class="btn-chip" href="${esc(o.imageUrl)}" target="_blank">Open Image</a>` : ""}
  </div>`;
  openPopover(o.kind === "final" ? "Final Output" : "Sample Output", html, true);
}

function openVaultPopover() {
  if (!state.vault.length) { openPopover("Vault", "<div class='output-empty'>ভল্ট ফাঁকা আছে।</div>"); return; }
  const html = state.vault.slice().reverse().map((v, rIdx) => {
    const idx = state.vault.length - 1 - rIdx;
    return `<div class="key-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div onclick="openVaultItemPopover(${idx})" style="cursor:pointer;flex:1;"><b>${esc(v.title)}</b><div style="font-size:10px;color:var(--muted);">${esc(v.time)}</div></div>
      <button class="btn-chip danger" onclick="deleteVaultItem(${idx})">Del</button>
    </div>`;
  }).join("");
  openPopover("Extra / Vault", html, true);
}

function openVaultItemPopover(idx) {
  const v = state.vault[idx];
  if (!v) return;
  let html = "";
  if (v.imageUrl) html += `<img src="${esc(v.imageUrl)}" style="width:100%;border-radius:8px;margin-bottom:8px;" />`;
  if (v.audioData) html += `<audio controls src="${v.audioData}"></audio>`;
  html += `<div style="white-space:pre-wrap;font-size:12px;max-height:200px;overflow-y:auto;">${esc(v.text)}</div>`;
  html += `<div class="row-gap">
    <button class="btn-chip active" onclick="downloadVaultItem(${idx})">Download</button>
    <button class="btn-chip danger" onclick="deleteVaultItem(${idx});closePopover();">Delete</button>
  </div>`;
  openPopover(v.title, html, true);
}

function downloadVaultItem(idx) {
  const v = state.vault[idx];
  if (!v) return;
  const blob = new Blob([v.text || ""], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Vault-${idx + 1}.txt`;
  a.click();
}

function deleteVaultItem(idx) {
  state.vault.splice(idx, 1);
  saveState();
  renderVault();
  if (document.getElementById("popBackdrop").classList.contains("open")) openVaultPopover();
}

function openAlertPopover(cat) {
  const list = state.alerts[cat] || [];
  list.forEach(x => x.read = true);
  saveState();
  renderAlerts();
  const html = list.length
    ? list.map(x => `<div class="key-card"><div style="font-size:10px;color:var(--muted);">${esc(x.time)}</div><div>${esc(x.msg)}</div></div>`).join("")
    : `<div class="output-empty">কোনো নতুন মেসেজ বা সতর্কতা নেই।</div>`;
  openPopover(cat.toUpperCase() + " Alerts (Read-Only)", html);
}

function openDisturbPopover() {
  const html = state.disturbs.length
    ? state.disturbs.map(d => `<div class="key-card" style="border-color:var(--red);"><b>${esc(d.agent)}</b> <span style="font-size:10px;color:var(--muted);">${esc(d.time)}</span><div style="margin-top:4px;color:#fecaca;">${esc(d.msg)}</div></div>`).join("") +
      `<button class="btn-chip" onclick="state.disturbs=[];saveState();renderDisturbBar();closePopover();">Clear Errors</button>`
    : `<div class="output-empty">সব সিস্টেম একদম ঠিকঠাক চলছে।</div>`;
  openPopover("System Disturbances", html);
}

function openToolboxPopover() {
  const t = state.suggestedTool;
  if (!t) {
    openPopover("Toolbox (Standby)", `<div class="output-empty" style="padding:14px 0;">এখন কোনো এক্সটার্নাল টুলের প্রয়োজন নেই। কাজের সময় প্রয়োজন হলে AI এখানে কানেক্ট করার অপশন দেখাবে।</div>`);
    return;
  }
  const html = `
    <div class="key-card" style="text-align:center;">
      <div style="font-size:28px;">${esc(t.icon)}</div>
      <div style="font-weight:700;margin-top:4px;">${esc(t.name)} <span style="font-size:10px;color:var(--accent);">(${esc(t.mode)})</span></div>
      <div style="font-size:11.5px;color:var(--muted);margin:6px 0 10px;">${esc(t.note)}</div>
      <button class="btn-chip active" onclick="alert('${esc(t.name)} কানেক্টর পরবর্তী আপডেটে যুক্ত হবে।')">Connect ${esc(t.name)}</button>
    </div>`;
  openPopover("Toolbox Connector", html);
}

function openFilesPopover() {
  if (!state.savedProjects.length) { openPopover("Saved Files", "<div class='output-empty'>কোনো সেভ করা প্রজেক্ট নেই।</div>"); return; }
  const html = state.savedProjects.map((p, idx) => `
    <div class="key-card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><b>${esc(p.title)}</b><div style="font-size:10px;color:var(--muted);">${esc(p.time)}</div></div>
      <div class="row-gap" style="margin:0;">
        <button class="btn-chip active" onclick="loadSavedProject(${idx})">Open</button>
        <button class="btn-chip danger" onclick="state.savedProjects.splice(${idx},1);saveState();openFilesPopover();">Del</button>
      </div>
    </div>`).join("");
  openPopover("Saved Projects", html, true);
}

function loadSavedProject(idx) {
  const p = state.savedProjects[idx];
  if (!p) return;
  state.chat = p.chat || [];
  state.output = p.output || null;
  state.memory = p.memory || "";
  saveState();
  renderAll();
  closePopover();
}

function openLockPopover() {
  const html = `
    <label class="field-label">Character Bible & Continuity (Part 2+)</label>
    <textarea class="field-textarea" id="memInput" placeholder="চরিত্রের চেহারা, পোশাক ও গল্পের ধারাবাহিকতা...">${esc(state.memory)}</textarea>
    <div class="row-gap">
      <button class="btn-chip active" onclick="saveMemoryManual()">Save Lock</button>
      <button class="btn-chip" onclick="autoExtractMemory()">Auto-Extract</button>
      <button class="btn-chip danger" onclick="state.memory='';saveState();renderAll();closePopover();">Clear</button>
    </div>`;
  openPopover("Continuity Lock", html, true);
}

function saveMemoryManual() {
  state.memory = document.getElementById("memInput").value.trim();
  saveState();
  renderAll();
  closePopover();
}

async function autoExtractMemory() {
  const ctx = state.output?.text || state.chat.slice(-4).map(m => m.text).join("\n");
  if (!ctx) { alert("লক করার মতো কোনো কন্টেন্ট নেই।"); return; }
  const r = await fetch("/api/extract-continuity", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ config: getDirectorConfig(), existing_memory: state.memory, latest_context: ctx })
  });
  const d = await r.json();
  if (d.ok && d.memory) {
    state.memory = d.memory;
    saveState();
    renderAll();
    document.getElementById("memInput").value = d.memory;
  } else {
    alert(d.error || "Continuity তৈরি করা যায়নি।");
  }
}

/* ---------- API SETTINGS POPOVER (ALL AGENTS + AUTO-DETECT + SUB-KEYS) ---------- */
function openApiPopover(agentId) {
  const cfg = state.agents[agentId] || defaultAgentCfg();
  state.agents[agentId] = cfg;

  const tabs = AGENTS.map(a => `<button class="btn-chip ${a.id === agentId ? "active" : ""}" onclick="openApiPopover('${a.id}')">${a.name.split(" ")[0]}</button>`).join("");

  const slotsHtml = cfg.keys.map((k, idx) => {
    const provOpts = PROVIDERS.map(p => `<option value="${p}" ${k.provider === p ? "selected" : ""}>${p.toUpperCase()}</option>`).join("");
    const modList = (k.models && k.models.length)
      ? `<select class="field-select" onchange="updateSlot('${agentId}',${idx},'model',this.value)">
          ${k.models.map(m => `<option value="${esc(m)}" ${k.model === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
         </select>`
      : `<input class="field-input" value="${esc(k.model)}" placeholder="Model (Auto)" onchange="updateSlot('${agentId}',${idx},'model',this.value)" />`;
    const dotCls = k.status === "ok" ? "green" : k.status === "error" ? "red" : k.status === "warn" ? "yellow" : "";

    return `<div class="key-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-weight:600;font-size:11.5px;"><span class="dot ${dotCls}" style="margin-right:5px;"></span>Key #${idx + 1}</span>
        <div style="display:flex;gap:4px;">
          <button class="btn-chip active" onclick="autoDetectSlot('${agentId}',${idx})">Auto-Detect</button>
          ${cfg.keys.length > 1 ? `<button class="btn-chip danger" onclick="removeSlot('${agentId}',${idx})">✕</button>` : ""}
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:5px;">
        <select class="field-select" onchange="updateSlot('${agentId}',${idx},'provider',this.value)">${provOpts}</select>
        ${modList}
      </div>
      <input class="field-input" style="margin-top:5px;" type="password" value="${esc(k.apiKey)}" placeholder="Main API Key..." onchange="updateSlot('${agentId}',${idx},'apiKey',this.value)" />
      <input class="field-input" style="margin-top:5px;" type="password" value="${esc(k.subKey || "")}" placeholder="Backup Sub-Key (Optional)..." onchange="updateSlot('${agentId}',${idx},'subKey',this.value)" />
      ${k.lastMsg ? `<div style="font-size:10px;color:${k.status === "error" ? "#fca5a5" : "#86efac"};margin-top:4px;">${esc(k.lastMsg)}</div>` : ""}
    </div>`;
  }).join("");

  let extraAudio = "";
  if (agentId === "audio") {
    extraAudio = `<div class="key-card">
      <div style="font-weight:600;margin-bottom:5px;">ElevenLabs Quick SFX / Voice Test</div>
      <input class="field-input" id="elQuickText" placeholder="ভয়েস বা সাউন্ড ইফেক্ট লেখো..." />
      <div class="row-gap">
        <button class="btn-chip active" onclick="quickEleven('tts')">Test Voice</button>
        <button class="btn-chip" onclick="quickEleven('sfx')">Test SFX</button>
      </div>
      <div id="elQuickOut"></div>
    </div>`;
  }

  const html = `
    <div class="row-gap" style="margin-top:0;margin-bottom:10px;">${tabs}</div>
    ${slotsHtml}
    <div class="row-gap">
      <button class="btn-chip" onclick="addSlot('${agentId}')">+ Add Key Slot</button>
      <button class="btn-chip active" onclick="closePopover()">Done</button>
    </div>
    ${extraAudio}
  `;
  openPopover("API Control · " + agentId.toUpperCase(), html, true);
}

function updateSlot(agentId, idx, field, val) {
  state.agents[agentId].keys[idx][field] = val.trim();
  saveState();
  renderApiList();
}

function addSlot(agentId) {
  state.agents[agentId].keys.push({ provider: "openrouter", model: "", apiKey: "", subKey: "", models: [], status: "idle", lastMsg: "" });
  saveState();
  openApiPopover(agentId);
}

function removeSlot(agentId, idx) {
  state.agents[agentId].keys.splice(idx, 1);
  saveState();
  renderApiList();
  openApiPopover(agentId);
}

async function autoDetectSlot(agentId, idx) {
  const slot = state.agents[agentId].keys[idx];
  if (!slot.apiKey) { alert("আগে API Key পেস্ট করো।"); return; }
  slot.status = "warn";
  slot.lastMsg = "Checking...";
  openApiPopover(agentId);

  try {
    const r = await fetch("/api/auto-detect-key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        apiKey: slot.apiKey,
        provider: slot.provider,
        model: slot.model,
        agentId
      })
    });
    const d = await r.json();
    if (d.ok) {
      slot.provider = d.provider || slot.provider;
      slot.model = d.model || d.auto_model || slot.model;
      slot.models = d.models || [];
      slot.status = "ok";
      slot.lastMsg = `Connected · ${slot.provider.toUpperCase()} (${slot.models.length} models)`;
    } else {
      slot.status = "error";
      slot.lastMsg = d.error || "Key কাজ করেনি";
      addDisturb(agentId.toUpperCase(), slot.lastMsg);
      if (agentId !== "director") addAlert(agentId, slot.lastMsg);
    }
  } catch (e) {
    slot.status = "error";
    slot.lastMsg = String(e);
  }
  saveState();
  renderApiList();
  openApiPopover(agentId);
}

async function quickEleven(mode) {
  const key = getElevenLabsKey();
  const txt = document.getElementById("elQuickText")?.value.trim();
  if (!key || !txt) { alert("ElevenLabs Key এবং লেখা দুটোই দাও।"); return; }
  const out = document.getElementById("elQuickOut");
  out.innerHTML = "<div style='font-size:11px;margin-top:5px;'>Generating...</div>";
  const r = await fetch(mode === "sfx" ? "/api/elevenlabs/sfx" : "/api/elevenlabs/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ apiKey: key, text: txt })
  });
  const d = await r.json();
  if (d.ok && d.audio_base64) {
    out.innerHTML = `<audio controls autoplay src="${d.audio_base64}"></audio>`;
  } else {
    out.innerHTML = `<div style='color:#fca5a5;font-size:11px;margin-top:5px;'>${esc(d.error || "Error")}</div>`;
  }
}

renderAll();
