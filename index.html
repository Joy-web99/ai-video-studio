<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Studio</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 700px;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #38bdf8;
    }
    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #cbd5e1;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #22c55e;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      background: #64748b;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      color: #facc15;
    }
    .output {
      white-space: pre-wrap;
      background: #020617;
      padding: 14px;
      border-radius: 8px;
      min-height: 120px;
      border: 1px solid #334155;
      margin-top: 10px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>AI Video Studio</h2>

    <div class="card">
      <label>১. Primary API Key (OpenRouter):</label>
      <input type="password" id="apiKey1" placeholder="প্রথম API Key এখানে দাও">

      <label>২. Extra / Backup API Key (অসুবিধা হলে এটায় সুইচ করবে):</label>
      <input type="password" id="apiKey2" placeholder="দ্বিতীয় API Key এখানে দাও (অপশনাল)">

      <label>মডেল সিলেক্ট করো:</label>
      <input type="text" id="modelName" value="google/gemma-2-9b-it:free">
    </div>

    <div class="card">
      <label>মাস্টার প্রম্পট (Master Prompt):</label>
      <textarea id="masterPrompt" rows="5" placeholder="তোমার মাস্টার প্রম্পট এখানে লেখো..."></textarea>
      <button id="runBtn" onclick="startWork()">কাজ শুরু করো</button>
      <div class="status" id="statusText"></div>
    </div>

    <div class="card">
      <label>রেজাল্ট (Output):</label>
      <div class="output" id="outputBox">এখানে উত্তর দেখাবে...</div>
    </div>
  </div>

  <script>
    window.onload = () => {
      document.getElementById("apiKey1").value = localStorage.getItem("apiKey1") || "";
      document.getElementById("apiKey2").value = localStorage.getItem("apiKey2") || "";
    };

    async function callAPI(apiKey, model, prompt) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 20000);

      const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + apiKey,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: model,
          messages: [{ role: "user", content: prompt }]
        }),
        signal: controller.signal
      });

      clearTimeout(timeout);
      if (!response.ok) throw new Error("API Error: " + response.status);
      const data = await response.json();
      return data.choices[0].message.content;
    }

    async function startWork() {
      const key1 = document.getElementById("apiKey1").value.trim();
      const key2 = document.getElementById("apiKey2").value.trim();
      const model = document.getElementById("modelName").value.trim();
      const prompt = document.getElementById("masterPrompt").value.trim();
      const status = document.getElementById("statusText");
      const output = document.getElementById("outputBox");
      const btn = document.getElementById("runBtn");

      if (!key1 || !prompt) {
        status.innerText = "আগে Primary API Key এবং মাস্টার প্রম্পট দাও।";
        return;
      }

      localStorage.setItem("apiKey1", key1);
      localStorage.setItem("apiKey2", key2);

      btn.disabled = true;
      output.innerText = "কাজ চলছে...";
      status.innerText = "১ নম্বর API Key দিয়ে চেষ্টা করা হচ্ছে...";

      try {
        const result = await callAPI(key1, model, prompt);
        output.innerText = result;
        status.innerText = "১ নম্বর API Key দিয়ে কাজ সফল হয়েছে!";
      } catch (err1) {
        if (key2) {
          status.innerText = "১ নম্বর Key কাজ করেনি বা দেরি হয়েছে। ২ নম্বর Extra Key-তে সুইচ করা হচ্ছে...";
          try {
            const result2 = await callAPI(key2, model, prompt);
            output.innerText = result2;
            status.innerText = "২ নম্বর Extra API Key দিয়ে কাজ সফল হয়েছে!";
          } catch (err2) {
            output.innerText = "দুটো API Key দিয়েই কাজ হয়নি। Key ঠিক আছে কি না চেক করো।";
            status.innerText = "এরর হয়েছে।";
          }
        } else {
          output.innerText = "১ নম্বর API Key কাজ করেনি এবং কোনো Extra Key দেওয়া নেই।";
          status.innerText = "এরর হয়েছে।";
        }
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
