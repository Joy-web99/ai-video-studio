<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AI Video Studio</title>
<style>
  :root {
    --bg: #0b0f17;
    --panel: #121826;
    --panel-2: #172033;
    --border: #243047;
    --text: #e6edf7;
    --muted: #8b9bb4;
    --accent: #38bdf8;
    --accent-soft: rgba(56, 189, 248, 0.14);
    --green: #22c55e;
    --blue: #3b82f6;
    --yellow: #f59e0b;
    --red: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; width: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px; overflow: hidden;
  }
  .app-shell {
    display: flex; flex-direction: column; height: 100dvh; width: 100%;
    padding: 6px; gap: 6px;
  }

  /* Top Bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 6px 10px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 14px; }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .top-actions { display: flex; gap: 5px; align-items: center; }
  .btn-chip {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; transition: 0.15s;
  }
  .btn-chip:active { transform: scale(0.96); }
  .btn-chip.active { border-color: var(--accent); background: var(--accent-soft); color: #fff; }
  .btn-chip.locked { border-color: var(--green); color: var(--green); }
  .btn-chip.danger { border-color: rgba(239,68,68,0.45); color: #fca5a5; }

  /* 6-Box Workspace (Tools Collapsed by Default -> Bigger Workflow) */
  .workspace { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .upper-row { flex: 1.25; min-height: 0; display: grid; grid-template-columns: 1.65fr 1fr; gap: 6px; }
  .lower-row { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1.65fr; gap: 6px; transition: 0.2s; }
  .lower-row.tools-open { grid-template-columns: 0.95fr 1.2fr 0.62fr; }

  /* Box Card */
  .box {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); display: flex; flex-direction: column;
    min-height: 0; overflow: hidden; position: relative;
  }
  .box-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02); flex-shrink: 0;
  }
  .box-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }

  /* 4-Color Live Status Dots */
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #475569;
    display: inline-block; flex-shrink: 0; transition: 0.2s;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.blue { background: var(--blue); box-shadow: 0 0 8px var(--accent); animation: pulse 0.85s infinite; }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 7px var(--yellow); animation: pulse 1.3s infinite; }
  .dot.red { background: var(--red); box-shadow: 0 0 7px var(--red); animation: pulse 1.1s infinite; }
  .dot-btn { cursor: pointer; padding: 2px; border-radius: 50%; display: inline-flex; align-items: center; }
  .dot-btn:active { transform: scale(1.25); }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.88); } }

  .icon-btn {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; font-size: 13px; padding: 2px 5px; border-radius: 6px;
  }
  .icon-btn:active { background: var(--panel-2); color: var(--text); }
  .icon-btn.glow { color: var(--accent); animation: pulse 1.1s infinite; }

  /* Box 1: Director Chat */
  .chat-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth;
  }
  .msg {
    max-width: 92%; padding: 8px 10px; border-radius: 10px;
    line-height: 1.45; word-wrap: break-word; font-size: 12.5px; white-space: pre-wrap;
  }
  .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; border-bottom-right-radius: 3px; }
  .msg.ai { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.sys {
    align-self: center; background: rgba(56,189,248,0.08);
    border: 1px dashed rgba(56,189,248,0.35); color: #bae6fd;
    font-size: 11px; padding: 5px 9px; text-align: center;
  }
  .msg-tools { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .mini-act {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .mini-act.primary { background: var(--accent); color: #06101c; border-color: var(--accent); font-weight: 600; }
  .mini-act.speaking { background: var(--red); border-color: var(--red); color: #fff; }

  /* Draft Edit Bar (Before Sending / Voice Review) */
  .draft-bar {
    display: none; align-items: center; justify-content: space-between; gap: 6px;
    padding: 4px 8px; background: rgba(56,189,248,0.1); border-top: 1px solid var(--border);
    font-size: 11px; color: #bae6fd; flex-shrink: 0;
  }
  .draft-bar.show { display: flex; }

  .chat-input-wrap {
    display: flex; gap: 5px; padding: 6px; border-top: 1px solid var(--border);
    background: var(--panel); align-items: center; flex-shrink: 0;
  }
  .chat-input {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12.5px; outline: none; min-width: 0;
  }
  .chat-input:focus { border-color: var(--accent); }
  .send-btn {
    background: var(--accent); color: #06101c; border: none; border-radius: 8px;
    padding: 7px 10px; font-weight: 700; font-size: 11.5px; cursor: pointer;
  }

  /* 4 Category Columns + Per-Key LED Matrix under each Category */
  .cat-matrix {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    padding: 4px 6px 6px; border-top: 1px solid var(--border);
    background: rgba(0,0,0,0.22); flex-shrink: 0;
  }
  .cat-col {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer;
  }
  .cat-col.has-alert { border-color: var(--yellow); background: rgba(245,158,11,0.12); }
  .cat-top {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    font-size: 9.5px; font-weight: 600; color: var(--text); width: 100%;
  }
  .cat-leds {
    display: flex; align-items: center; justify-content: center; gap: 3px;
    flex-wrap: wrap; min-height: 10px;
  }
  .badge-num {
    background: var(--yellow); color: #0b0f17; font-weight: 700; font-size: 8.5px;
    padding: 0 3px; border-radius: 6px;
  }

  /* Right Upper: Output + Vault */
  .right-upper { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .box-output { flex: 1.25; }
  .box-vault { flex: 0.85; }
  .output-body {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 6px; justify-content: center; align-items: center;
  }
  .output-body.has-content { justify-content: flex-start; align-items: stretch; }
  .output-empty { color: var(--muted); font-size: 11px; text-align: center; opacity: 0.75; }
  .output-img { width: 100%; max-height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .output-text-snippet { font-size: 11px; color: #cbd5e1; line-height: 1.35; max-height: 70px; overflow: hidden; }
  .output-pulse { width: 100%; height: 3px; background: var(--panel-2); overflow: hidden; display: none; }
  .output-pulse.active { display: block; }
  .output-pulse::after { content: ""; display: block; width: 45%; height: 100%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .output-foot {
    display: flex; gap: 4px; padding: 4px 6px; border-top: 1px solid var(--border);
    justify-content: space-between; align-items: center; flex-shrink: 0;
  }

  /* Vault */
  .vault-body { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 4px; }
  .vault-item {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 6px; font-size: 10.5px; cursor: pointer;
  }
  .vault-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* Box 4: API Control with Per-Key Dots */
  .api-list { flex: 1; min-height: 0; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; gap: 5px; }
  .api-row {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 7px; cursor: pointer; display: flex; flex-direction: column; gap: 3px;
  }
  .api-row-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 600; gap: 4px; }
  .dots-wrap { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .api-row-sub { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Box 5: Live Workflow + Bottom Blinking Notification Bar */
  .wf-feed {
    flex: 1; min-height: 0; overflow-y: auto; padding: 6px;
    display: flex; flex-direction: column; gap: 5px; scroll-behavior: smooth;
  }
  .wf-item {
    background: var(--panel-2); border-left: 2px solid var(--accent);
    border-radius: 6px; padding: 5px 7px; font-size: 11px; line-height: 1.35;
  }
  .wf-item.ok { border-left-color: var(--green); }
  .wf-item.work { border-left-color: var(--blue); }
  .wf-item.warn { border-left-color: var(--yellow); }
  .wf-item.err { border-left-color: var(--red); }
  .wf-meta { font-size: 9.5px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 2px; }

  .notif-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px; border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.02); font-size: 10.5px; color: var(--muted);
    cursor: pointer; flex-shrink: 0;
  }
  .notif-bar.has-notif {
    background: rgba(245,158,11,0.15); color: #fde68a; border-top-color: var(--yellow);
  }
  .notif-pill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }
  .notif-bar.has-notif .notif-pill { animation: pulse 1.1s infinite; }

  /* Box 6: Collapsible Toolbox */
  .box-tools { display: none; }
  .lower-row.tools-open .box-tools { display: flex; }
  .toolbox-body {
    flex: 1; min-height: 0; padding: 6px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-align: center;
  }
  .toolbox-slot {
    width: 100%; border: 1px dashed var(--border); border-radius: 9px;
    padding: 10px 4px; color: var(--muted); font-size: 10.5px;
  }
  .toolbox-slot.active { border-style: solid; border-color: var(--accent); background: var(--accent-soft); color: #e0f2fe; }

  /* Compact Floating Popover */
  .popover-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.48);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 14px;
  }
  .popover-backdrop.open { display: flex; }
  .popover-card {
    width: 100%; max-width: 350px; max-height: 82dvh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; box-shadow: 0 18px 40px rgba(0,0,0,0.6);
  }
  .popover-card.wide { max-width: 460px; }
  .pop-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border);
    font-weight: 700; font-size: 13px;
  }
  .field-label { font-size: 11px; color: var(--muted); margin: 7px 0 3px; display: block; }
  .field-input, .field-select, .field-textarea {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 9px; font-size: 12px; outline: none;
  }
  .field-textarea { min-height: 75px; resize: vertical; }
  .row-gap { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .key-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px; margin-bottom: 8px;
  }
  .mini-chat-box {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    display: flex; gap: 5px;
  }
  audio { width: 100%; height: 32px; margin-top: 4px; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Top Header -->
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span> AI Video Studio</div>
    <div class="top-actions">
      <button class="btn-chip" id="btnLock" onclick="openLockPopover()">Lock</button>
      <button class="btn-chip" id="btnSave" onclick="saveCurrentProject()">Save</button>
      <button class="btn-chip" id="btnFiles" onclick="openFilesPopover()">Files</button>
      <button class="btn-chip" id="btnPause" onclick="cancelActiveJob()">Stop</button>
    </div>
  </header>

  <!-- 6-Box Workspace -->
  <main class="workspace">

    <!-- Upper Row: Box 1 (Chat) + Box 2 (Output) & Box 3 (Vault) -->
    <section class="upper-row">

      <!-- Box 1: Director AI Chat -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot" id="directorDot"></span> Director AI</div>
          <div>
            <button class="icon-btn" onclick="openChatFull()" title="Expand">⤢</button>
            <button class="icon-btn" onclick="clearChat()" title="Clear">🗑</button>
          </div>
        </div>
        <div class="chat-feed" id="chatFeed"></div>

        <!-- Edit / Cancel Draft Bar before Sending -->
        <div class="draft-bar" id="draftBar">
          <span>Draft ready · Edit or send</span>
          <div style="display:flex;gap:4px;">
            <button class="mini-act" onclick="focusChatInput()">Edit</button>
            <button class="mini-act" onclick="clearDraft()">Cancel</button>
          </div>
        </div>

        <div class="chat-input-wrap">
          <button class="icon-btn" id="micBtn" onclick="toggleVoiceInput()" title="Voice">🎤</button>
          <input class="chat-input" id="chatInput" placeholder="কথা বলো বা কাজ লেখো..." oninput="onDraftInput()" onkeydown="if(event.key==='Enter')sendChat()" />
          <button class="send-btn" id="sendBtn" onclick="sendChat()">Send</button>
        </div>

        <!-- 4 Categories + Per-Key LED Matrix under each Category -->
        <div class="cat-matrix">
          <div class="cat-col" id="col-image" onclick="openAgentAlertPopover('image')">
            <div class="cat-top">Image <span class="badge-num" id="anum-image" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-image"></div>
          </div>
          <div class="cat-col" id="col-video" onclick="openAgentAlertPopover('video')">
            <div class="cat-top">Video <span class="badge-num" id="anum-video" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-video"></div>
          </div>
          <div class="cat-col" id="col-audio" onclick="openAgentAlertPopover('audio')">
            <div class="cat-top">Audio <span class="badge-num" id="anum-audio" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-audio"></div>
          </div>
          <div class="cat-col" id="col-editing" onclick="openAgentAlertPopover('editing')">
            <div class="cat-top">Edit <span class="badge-num" id="anum-editing" style="display:none;">0</span></div>
            <div class="cat-leds" id="leds-editing"></div>
          </div>
        </div>
      </div>

      <!-- Right Upper Stack: Box 2 (Output) + Box 3 (Vault) -->
      <div class="right-upper">
        <div class="box box-output">
          <div class="box-head">
            <div class="box-title"><span class="dot" id="outDot"></span> Output</div>
            <button class="icon-btn" onclick="openOutputPopover()" title="Full">⤢</button>
          </div>
          <div class="output-pulse" id="outPulse"></div>
          <div class="output-body" id="outBody">
            <div class="output-empty">স্যাম্পল বা ফাইনাল আউটপুট এখানে দেখাবে</div>
          </div>
          <div class="output-foot">
            <span id="outTag" style="font-size:10px;color:var(--muted);">Standby</span>
            <button class="btn-chip" style="padding:3px 7px;" onclick="downloadCurrentOutput()">Download</button>
          </div>
        </div>

        <div class="box box-vault">
          <div class="box-head">
            <div class="box-title">Vault (<span id="vaultCount">0</span>)</div>
            <button class="icon-btn" onclick="openVaultPopover()" title="Open">⤢</button>
          </div>
          <div class="vault-body" id="vaultBody">
            <div class="output-empty">বাড়তি ফাইল এখানে জমবে</div>
          </div>
        </div>
      </div>

    </section>

    <!-- Lower Row: Box 4 (API) + Box 5 (Big Workflow) + Collapsible Box 6 (Tools) -->
    <section class="lower-row" id="lowerRow">

      <!-- Box 4: API Keys -->
      <div class="box">
        <div class="box-head">
          <div class="box-title">API Keys</div>
          <button class="icon-btn" onclick="openApiPopover('director')" title="Settings">⚙</button>
        </div>
        <div class="api-list" id="apiList"></div>
      </div>

      <!-- Box 5: Live Workflow + Bottom Blinking Notification Bar -->
      <div class="box">
        <div class="box-head">
          <div class="box-title"><span class="dot" id="wfDot"></span> Workflow <span id="coworkBadge" style="font-size:9px;color:var(--accent);margin-left:3px;">Solo</span></div>
          <div style="display:flex;align-items:center;gap:2px;">
            <button class="icon-btn" onclick="clearWorkflow()" title="Clear">🗑</button>
            <button class="icon-btn" id="toolsToggleBtn" onclick="toggleToolsDrawer()" title="Tools">◀</button>
          </div>
        </div>
        <div class="wf-feed" id="wfFeed"></div>
        <div class="notif-bar" id="notifBar" onclick="openNotifPopover()">
          <span class="notif-pill" id="notifText">🔔 0</span>
          <span style="font-size:10px;">Tap</span>
        </div>
      </div>

      <!-- Box 6: Collapsible Tools -->
      <div class="box box-tools">
        <div class="box-head">
          <div class="box-title">Tools</div>
          <button class="icon-btn" onclick="toggleToolsDrawer()" title="Hide">▶</button>
        </div>
        <div class="toolbox-body" onclick="openToolboxPopover()">
          <div class="toolbox-slot" id="toolboxSlot">
            <div id="toolboxIcon" style="font-size:16px;margin-bottom:3px;">+</div>
            <div id="toolboxText">Standby</div>
          </div>
        </div>
      </div>

    </section>

  </main>
</div>

<!-- Compact Floating Popover -->
<div class="popover-backdrop" id="popBackdrop" onclick="if(event.target===this)closePopover()">
  <div class="popover-card" id="popCard">
    <div class="pop-head">
      <script>
const AGENTS = [
  { id: "director", name: "Director AI", role: "Lead & Chat" },
  { id: "image", name: "Image AI", role: "Visuals" },
  { id: "video", name: "Video AI", role: "Motion" },
  { id: "audio", name: "Audio AI", role: "Voice & SFX" },
  { id: "editing", name: "Editing AI", role: "Cut & Sub" }
];

const CATEGORIES = ["image", "video", "audio", "editing"];

const PROVIDERS = ["google", "openrouter", "groq", "openai", "anthropic", "deepseek", "mistral", "elevenlabs", "runway", "custom"];

const STORE_KEY = "ai_studio_v12_state";
let state = loadState();
let activeJobId = null;
let handledJobs = new Set();
let failedModelsByKey = {};
let workingMap = {}; // { agentId: { keyIdx, cats: [] } }
let speakingBtn = null;
let recognition = null;
let isListening = false;

function makeSlot(provider = "openrouter") {
  return {
    provider,
    model: "",
    apiKey: "",
    models: [],
    status: "idle", // idle | ok | warn | error
    lastMsg: "",
    bnNote: "",
    miniChat: []
  };
}

function defaultAgentCfg() {
  return {
    keys: [makeSlot("openrouter"), makeSlot("google")]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { ...freshState(), ...parsed };
    }
  } catch (e) {}
  return freshState();
}

function freshState() {
  const agents = {};
  AGENTS.forEach(a => agents[a.id] = defaultAgentCfg());
  return {
    agents,
    chat: [
      {
        id: "welcome",
        role: "ai",

function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}

function esc(s) {
  return String(s || "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function nowTime() {
  const d = new Date();
  return d.toTimeString().slice(0, 5);
}

/* ---------- TRANSLATE ERROR / MESSAGE TO SIMPLE BANGLA ---------- */
function toBanglaMsg(raw) {
  const s = String(raw || "");
  if (/402|insufficient credits|credits/i.test(s)) return "এই Key বা মডেলে ক্রেডিট বা ব্যালেন্স নেই। অন্য মডেল বা Key ব্যবহার করো।";
  if (/429|rate limit|quota/i.test(s)) return "ব্যবহারের সীমা (Rate Limit) ছুঁয়ে গেছে। একটু পরে চেষ্টা করো বা অন্য Key/মডেল নাও।";
  if (/401|403|invalid api key|unauthorized/i.test(s)) return "API Key-টি সঠিক নয় বা মেয়াদ শেষ হয়ে গেছে।";
  if (/404|model.*not found/i.test(s)) return "নির্বাচিত মডেলটি এই মুহূর্তে পাওয়া যাচ্ছে না। অন্য মডেল বেছে নাও।";
  if (/timeout|network|fetch/i.test(s)) return "সার্ভারের সাথে সংযোগে সাময়িক দেরি বা নেটওয়ার্ক সমস্যা হয়েছে।";
  return s ? `সার্ভার বার্তা: ${s.slice(0, 140)}` : "কাজ করতে গিয়ে একটি সমস্যা দেখা দিয়েছে।";
}

/* ---------- LED STATE RESOLUTION (BLUE > YELLOW > RED > GREEN > IDLE) ---------- */
function getSlotColor(agentId, keyIdx, cat = null) {
  const w = workingMap[agentId];
  const isWorkingThisKey = !!(w && w.keyIdx === keyIdx);
  const matchesCat = !cat || (w && Array.isArray(w.cats) && w.cats.includes(cat));
  if (isWorkingThisKey && matchesCat) return "blue";

  const slot = state.agents[agentId]?.keys?.[keyIdx];
  if (!slot || !(slot.apiKey || "").trim()) return "";
  if (slot.status === "error") return "red";
  if (slot.status === "warn") return "yellow";
  return "green";
}

function setWorking(agentId, keyIdx, cats = []) {
  workingMap[agentId] = { keyIdx, cats };
  renderAll();
}

function clearWorking(agentId = null) {
  if (agentId) delete workingMap[agentId];
  else workingMap = {};
  renderAll();
}

/* Per-Category LED Matrix: shows LEDs for keys/agents working on or mapped to that category */
function renderCategoryMatrix() {
  CATEGORIES.forEach(cat => {
    const col = document.getElementById("col-" + cat);
    const badge = document.getElementById("anum-" + cat);
    const ledsEl = document.getElementById("leds-" + cat);
    if (!col || !badge || !ledsEl) return;

    const alerts = state.alerts[cat] || [];
    const unread = alerts.filter(x => !x.read).length;
    col.classList.toggle("has-alert", unread > 0);
    badge.style.display = unread > 0 ? "inline-block" : "none";
    badge.textContent = unread;

    // Collect LEDs for keys in this category + any key actively working on this category
    let ledHtml = "";
    const catKeys = state.agents[cat]?.keys || [];
    catKeys.forEach((k, kIdx) => {
      const c = getSlotColor(cat, kIdx, cat);
      if (c) {
        ledHtml += `<span class="dot ${c}" title="${cat.toUpperCase()} Key #${kIdx + 1}"></span>`;
      }
    });
    // Also check if another agent's key is currently working on this category (e.g. Director or cross-task)
    Object.keys(workingMap).forEach(aid => {
      if (aid === cat) return;
      const w = workingMap[aid];
      if (w && Array.isArray(w.cats) && w.cats.includes(cat)) {
        ledHtml += `<span class="dot blue" title="${aid} working on ${cat}"></span>`;
      }
    });
    ledsEl.innerHTML = ledHtml || `<span style="font-size:8.5px;color:var(--muted);opacity:0.5;">—</span>`;
  });
}

/* ---------- RECORDING EVENTS, BANGLA SPEECH & NOTIFICATIONS ---------- */
function addWorkflow(from, to, msg, level = "") {
  state.workflow.push({ from, to, msg, level, time: nowTime() });
  if (state.workflow.length > 90) state.workflow.shift();
  saveState();
  renderWorkflow();
}

function pushNotification(source, rawMsg, agentId = "", keyIdx = null) {
  const bnMsg = toBanglaMsg(rawMsg);
  state.notifications.unshift({
    source,
    bnMsg,
    rawMsg: String(rawMsg || ""),
    time: nowTime(),
    read: false,
    agentId,
    keyIdx
  });
  if (state.notifications.length > 40) state.notifications.pop();
  if (agentId && keyIdx !== null && state.agents[agentId]?.keys?.[keyIdx]) {
    state.agents[agentId].keys[keyIdx].bnNote = bnMsg;
  }
  if (CATEGORIES.includes(agentId)) {
    state.alerts[agentId] = state.alerts[agentId] || [];
    state.alerts[agentId].unshift({ msg: bnMsg, time: nowTime(), read: false, keyIdx });
    if (state.alerts[agentId].length > 20) state.alerts[agentId].pop();
  }
  saveState();
  renderNotifBar();
  renderCategoryMatrix();
  renderApiList();
}

function pushChat(role, text, actions = []) {
  state.chat.push({ id: "m_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6), role, text, actions });
  if (state.chat.length > 80) state.chat.shift();
  saveState();
  renderChat();
}

function moveOutputToVault(reason) {
  if (!state.output) return;
  state.vault.push({
    title: `${state.output.kind === "final" ? "Final" : "Sample"} (${reason})`,
    text: state.output.text || "",
    imageUrl: state.output.imageUrl || "",
    audioData: state.output.audioData || "",
    time: nowTime()
  });
  if (state.vault.length > 30) state.vault.shift();
  saveState();
  renderVault();
}

  document.getElementById("chatInput").value = "";

function toggleVoiceInput() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("এই ব্রাউজারে ভয়েস টাইপিং সাপোর্ট নেই।"); return; }
  const btn = document.getElementById("micBtn");
  if (isListening && recognition) { recognition.stop(); return; }
  recognition = new SR();
  recognition.lang = "bn-IN";
  recognition.onstart = () => { isListening = true; btn.style.color = "var(--red)"; };
  recognition.onend = () => {
    isListening = false;
    btn.style.color = "";
    if (document.getElementById("chatInput").value.trim()) {
      document.getElementById("draftBar").classList.add("show");
    }
  };
  recognition.onresult = (e) => {
    const t = e.results[0][0].transcript;
    const inp = document.getElementById("chatInput");
    inp.value = (inp.value ? inp.value + " " : "") + t;
  };
  recognition.start();
}

/* ---------- TTS WITH INSTANT STOP ---------- */
function toggleSpeak(text, btn) {
  if (!("speechSynthesis" in window)) return;
  if (speakingBtn === btn && window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove("speaking");
    btn.textContent = "🔊";
    speakingBtn = null;
    return;
  }
  window.speechSynthesis.cancel();
  if (speakingBtn) {
    speakingBtn.classList.remove("speaking");
    speakingBtn.textContent = "🔊";
  }
  const u = new SpeechSynthesisUtterance(text.replace(/[*#_`]/g, ""));
  u.lang = /[\u0980-\u09FF]/.test(text) ? "bn-IN" : "en-US";
  u.onend = u.onerror = () => {
    btn.classList.remove("speaking");
    btn.textContent = "🔊";
    if (speakingBtn === btn) speakingBtn = null;
  };
  speakingBtn = btn;
  btn.classList.add("speaking");
  btn.textContent = "⏹";
  window.speechSynthesis.speak(u);
}

/* ---------- ZERO-REPEAT SEQUENTIAL POLLING ---------- */
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runBackendJob(payload) {
  const startRes = await fetch("/api/start-job", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const startData = await startRes.json();
  if (!startData.ok || !startData.job_id) {
    return { ok: false, error: startData.error || "Job শুরু করা যায়নি।" };
  }
  const jobId = startData.job_id;
  activeJobId = jobId;

  for (let i = 0; i < 90; i++) {
    await sleep(1100);
    if (activeJobId !== jobId) return { ok: false, cancelled: true };
    const r = await fetch(`/api/job/${jobId}`);
    const d = await r.json();
    if (!d.ok) return { ok: false, error: "Job পাওয়া যায়নি।" };
    if (d.status === "cancelled") return { ok: false, cancelled: true };
    if (d.status === "done" || d.status === "error") {
      if (handledJobs.has(jobId)) return { ok: false, duplicate: true };
      handledJobs.add(jobId);
      if (activeJobId === jobId) activeJobId = null;
      return d.result || { ok: false, error: "ফাঁকা উত্তর এসেছে।" };
    }
  }
  return { ok: false, error: "সার্ভার থেকে উত্তর আসতে বেশি সময় লাগছে।" };
}

async function cancelActiveJob() {
  if (!activeJobId) return;
  const jid = activeJobId;
  activeJobId = null;
  clearWorking();
  setOutputLoading(false);
  try { await fetch(`/api/cancel-job/${jid}`, { method: "POST" }); } catch (e) {}
  addWorkflow("User", "Studio", "চলমান কাজ বন্ধ করা হয়েছে।", "warn");
  pushChat("sys", "কাজটি থামানো হয়েছে।");
}

/* ---------- SMART INTENT: QUESTION VS PROJECT COMMAND ---------- */
function isCapabilityQuestion(text) {
  const t = text.trim().toLowerCase();
  const qWords = ["পারবে", "পারো", "কীভাবে", "কিভাবে", "ক্ষমতা", "কি কি", "কী কী", "কাজ করো", "ব্যাপারে বলো", "can you", "how do you", "what can you", "capable", "?"];
  const hasMake = ["বানাও", "তৈরি করো", "শুরু করো", "লিখে দাও", "create", "make", "generate", "build"].some(w => t.includes(w));
