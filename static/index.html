<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Video Production Studio — 6-Box Command Center</title>
  <style>
    /* ==========================================================================
       PART 1/7: DESIGN TOKENS, 100VH FIXED NO-SCROLL LAYOUT & UPPER BOXES CSS
       Covers: Theme Palette, Top Project Bar, 6-Box Grid Pipes,
               Box 1 (Chat + Spec Rail + Input Blur/Lock/Stop),
               Box 4 (Main Output Video Only) & Box 5 (Secondary/Dustbin Vault)
       ========================================================================== */
    :root {
      --bg-void: #070b14;
      --bg-panel: #0f172a;
      --bg-header: #16213a;
      --bg-card: #1b2845;
      --bg-field: #0a101f;
      --border-main: #273859;
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-violet: #8b5cf6;
      --led-green: #22c55e;
      --led-blue: #38bdf8;
      --led-yellow: #eab308;
      --led-red: #ef4444;
      --led-white: #ffffff;
      --pipe-glow: rgba(56, 189, 248, 0.42);
      --radius-xl: 13px;
      --radius-md: 9px;
      --radius-sm: 6px;
      --shadow-panel: 0 8px 24px rgba(2, 6, 23, 0.45);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top left, #111c35 0%, var(--bg-void) 68%);
      color: var(--text-primary);
      font-family: "Noto Sans Bengali", "Noto Sans Devanagari", "Noto Sans", system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      line-height: 1.38;
      user-select: none;
    }

    /* Custom sleek scrollbars only inside inner feeds */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.28);
      border-radius: 999px;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border-main);
      background: var(--bg-card);
      border-radius: var(--radius-sm);
      transition: transform 0.12s ease, background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
    }

    button:hover:not(:disabled) {
      border-color: rgba(96, 165, 250, 0.55);
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* --------------------------------------------------------------------------
       1. MASTER 100VH SHELL (TOP BAR + 6-BOX WORKSPACE + BOTTOM DOCTOR BAR)
       -------------------------------------------------------------------------- */
    .app-viewport {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 40px minmax(0, 1fr) 36px;
      gap: 6px;
      padding: 6px;
      overflow: hidden;
    }

    .top-command-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 9px;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-panel);
      min-height: 0;
    }

    .studio-identity {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }

    .studio-pulse-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--led-green);
      box-shadow: 0 0 10px var(--led-green);
      transition: background 0.2s ease, box-shadow 0.2s ease;
    }

    .studio-pulse-dot.busy {
      background: var(--led-blue);
      box-shadow: 0 0 12px var(--led-blue);
      animation: softPulse 0.9s infinite;
    }

    .project-control-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      overflow: hidden;
    }

    .top-slot-btn {
      padding: 3px 7px;
      font-size: 10.5px;
      background: var(--bg-field);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    .top-slot-btn.is-on {
      border-color: rgba(34, 197, 94, 0.6);
      background: rgba(34, 197, 94, 0.14);
      color: #86efac;
    }

    .top-slot-btn.saved-ok {
      border-color: rgba(56, 189, 248, 0.6);
      color: #bae6fd;
    }

    /* --------------------------------------------------------------------------
       2. 6-BOX FIXED WORKSPACE GRID & VISUAL PIPE CONNECTORS
       -------------------------------------------------------------------------- */
    .workspace-matrix {
      display: grid;
      grid-template-columns: minmax(0, 1.24fr) minmax(0, 0.96fr);
      grid-template-rows: minmax(0, 1.18fr) minmax(0, 0.92fr);
      gap: 8px;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .box-frame {
      position: relative;
      background: var(--bg-panel);
      border: 1px solid var(--border-main);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-panel);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .box-frame.is-zoomed {
      position: fixed;
      inset: 8px;
      z-index: 65;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.82);
      border-color: var(--accent-blue);
    }

    /* Pipe 1: Connects Box 1 (Chat) -> Box 4 (Main Output) */
    .box-frame.box-chat::after {
      content: "";
      position: absolute;
      top: 46%;
      right: -9px;
      width: 9px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent-blue), var(--pipe-glow));
      border-radius: 2px;
      pointer-events: none;
    }

    /* Pipe 2: Connects Box 4 (Main Output) -> Box 5 (Secondary/Dustbin Vault) */
    .box-frame.box-main-output::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -9px;
      transform: translateX(-50%);
      width: 4px;
      height: 9px;
      background: linear-gradient(180deg, var(--accent-cyan), var(--pipe-glow));
      border-radius: 2px;
      pointer-events: none;
    }

    .right-output-column {
      display: grid;
      grid-template-rows: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 8px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .lower-studio-band {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(0, 1.06fr) minmax(0, 1.34fr);
      gap: 8px;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .panel-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 8px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-subtle);
      min-height: 31px;
      flex-shrink: 0;
    }

    .panel-title-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .panel-label {
      font-weight: 700;
      font-size: 11.5px;
      white-space: nowrap;
    }

    .status-corner-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      white-space: nowrap;
    }

    .status-corner-badge.sample-mode {
      background: rgba(234, 179, 8, 0.18);
      border-color: rgba(234, 179, 8, 0.45);
      color: #fde047;
    }

    .status-corner-badge.final-mode {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.45);
      color: #86efac;
    }

    .status-corner-badge.extra-alert {
      background: rgba(168, 85, 247, 0.24);
      border-color: rgba(192, 132, 252, 0.65);
      color: #f3e8ff;
      animation: softPulse 1.15s infinite;
    }

    .panel-btn-cluster {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .tiny-btn {
      padding: 2px 6px;
      font-size: 10px;
      line-height: 1.25;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .tiny-btn.primary-tint {
      background: rgba(59, 130, 246, 0.2);
      border-color: rgba(59, 130, 246, 0.45);
      color: #bfdbfe;
    }

    .tiny-btn.danger-tint {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    /* --------------------------------------------------------------------------
       3. BOX 1: DIRECTOR CHAT, LEFT SPEC RAIL & BLUR/LOCK INPUT DOCK
       -------------------------------------------------------------------------- */
    .chat-split-stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      overflow: hidden;
    }

    .left-spec-rail {
      border: none;
      border-right: 1px solid var(--border-subtle);
      border-radius: 0;
      background: var(--bg-field);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 4px 2px;
      font-size: 9px;
      color: var(--text-muted);
    }

    .left-spec-rail.populated {
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.14);
      box-shadow: inset -2px 0 0 var(--accent-blue);
    }

    .left-spec-rail.approved {
      color: #86efac;
      background: rgba(34, 197, 94, 0.14);
      box-shadow: inset -2px 0 0 var(--led-green);
    }

    .chat-scroll-stream {
      overflow-y: auto;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
      user-select: text;
    }

    .msg-card {
      max-width: 90%;
      padding: 6px 8px;
      border-radius: var(--radius-md);
      font-size: 11.5px;
      word-break: break-word;
      border: 1px solid var(--border-subtle);
    }

    .msg-card.user {
      align-self: flex-end;
      background: rgba(59, 130, 246, 0.22);
      border-color: rgba(59, 130, 246, 0.45);
    }

    .msg-card.assistant {
      align-self: flex-start;
      background: var(--bg-card);
    }

    .msg-card.checkpoint {
      align-self: center;
      max-width: 96%;
      font-size: 10.5px;
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.35);
      color: #bbf7d0;
      text-align: center;
    }

    .msg-card.error-guide {
      align-self: center;
      max-width: 96%;
      font-size: 10.5px;
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    .msg-footer-tools {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9.5px;
      color: var(--text-muted);
    }

    .inline-text-action {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 9.5px;
      color: #93c5fd;
      text-decoration: underline;
    }

    .resource-chip-strip {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid var(--border-subtle);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .resource-chip-strip.has-items {
      display: flex;
    }

    .res-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 9.5px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #a5f3fc;
      white-space: nowrap;
    }

    .chat-composer-bar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 6px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    /* Blur & Lock state while Backend Job is SUBMITTING / RUNNING / CANCELLING */
    .chat-composer-bar.is-busy-locked .composer-lockable {
      filter: blur(1.5px);
      opacity: 0.42;
      pointer-events: none;
    }

    .composer-lockable {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
      transition: filter 0.18s ease, opacity 0.18s ease;
    }

    .square-tool-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .square-tool-btn.mic-active {
      border-color: var(--led-red);
      background: rgba(239, 68, 68, 0.22);
      color: #fecaca;
      animation: softPulse 0.95s infinite;
    }

    .composer-input {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-main);
      background: var(--bg-field);
      font-size: 11.5px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--accent-blue);
    }

    .composer-send-btn {
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-blue);
      border-color: #60a5fa;
      color: #ffffff;
      flex-shrink: 0;
    }

    .composer-stop-btn {
      height: 28px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      background: var(--led-red);
      border-color: #fca5a5;
      color: #ffffff;
      flex-shrink: 0;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6);
    }

    /* --------------------------------------------------------------------------
       4. BOX 4 (MAIN VIDEO OUTPUT) & BOX 5 (SECONDARY / DUSTBIN VAULT)
       -------------------------------------------------------------------------- */
    .video-preview-canvas {
      flex: 1;
      min-height: 0;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-field);
      overflow: hidden;
      position: relative;
    }

    .video-preview-canvas video {
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius-sm);
      background: #000000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }

    .placeholder-note {
      font-size: 10.5px;
      color: var(--text-muted);
      text-align: center;
      padding: 6px;
    }

    .dustbin-scroll-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: var(--bg-field);
    }

    .dustbin-item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      font-size: 10.5px;
    }

    .dustbin-item-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      overflow: hidden;
    }

    .dustbin-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dustbin-item-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }
